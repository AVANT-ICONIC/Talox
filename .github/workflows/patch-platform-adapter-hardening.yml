name: One-shot platform adapter hardening

on:
  push:
    branches:
      - feat/platform-adapters-v8-2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/platform-adapters-v8-2
          fetch-depth: 0
      - name: Patch registry hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/core/platform/PlatformAdapterRegistry.ts')
          text = path.read_text()

          host_anchor = '''function hostIs(hostname: string, domain: string): boolean {\n\treturn hostname === domain || hostname.endsWith(`.${domain}`);\n}\n'''
          helpers = '''function cloneRoutes(routes?: readonly PlatformRouteHint[]): PlatformRouteHint[] | undefined {\n\treturn routes?.map((route) => ({ ...route }));\n}\n\nfunction isolateContext(context: PlatformAdapterContext): Readonly<PlatformAdapterContext> {\n\treturn Object.freeze({\n\t\t...context,\n\t\tsearch: Object.freeze({ ...context.search }),\n\t});\n}\n'''
          if helpers not in text:
              text = text.replace(host_anchor, host_anchor + '\n' + helpers, 1)

          validation_anchor = '''\tif (typeof adapter.match !== "function") throw new TypeError("adapter.match must be a function.");\n'''
          validation = '''\tif (adapter.priority !== undefined && !Number.isFinite(adapter.priority)) {\n\t\tthrow new TypeError("adapter.priority must be a finite number when provided.");\n\t}\n'''
          if validation not in text:
              text = text.replace(validation_anchor, validation_anchor + validation, 1)

          text = text.replace('if (adapter.routes) normalized.routes = [...adapter.routes];', 'if (adapter.routes) normalized.routes = cloneRoutes(adapter.routes)!;')
          text = text.replace('if (adapter.routes) copy.routes = [...adapter.routes];', 'if (adapter.routes) copy.routes = cloneRoutes(adapter.routes)!;')
          text = text.replace('const confidence = adapter.match(context);', 'const confidence = adapter.match(isolateContext(context));')
          text = text.replace('routes: adapter.routes ? [...adapter.routes] : [],', 'routes: cloneRoutes(adapter.routes) ?? [],')

          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/platform/PlatformAdapterRegistry.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: isolate platform adapter extension inputs"
          git push origin HEAD:feat/platform-adapters-v8-2
