name: Skill Contract Fix Temp

on:
  push:
    branches: [fix/skill-manifest-contract]
  pull_request:
    branches: [fix/single-agent-skill-loading]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/skill-manifest-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply skill contract fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          loader_path = Path("src/core/skills/SkillLoader.ts")
          loader = loader_path.read_text()
          import_anchor = 'import { join, resolve, sep } from "node:path";'
          if 'from "js-yaml"' not in loader:
              if loader.count(import_anchor) != 1:
                  raise SystemExit("SkillLoader import anchor mismatch")
              loader = loader.replace(import_anchor, import_anchor + '\nimport { FAILSAFE_SCHEMA, load as loadYaml } from "js-yaml";', 1)

          parser_pattern = re.compile(
              r'\t/\*\*\n\t \* Minimal YAML parser[\s\S]*?(?=\n\t/\*\* Validate parsed values)',
          )
          parser_replacement = '''\t/**
\t * Parse skill frontmatter with the YAML parser Talox already ships.
\t * FAILSAFE_SCHEMA keeps scalar identifiers such as `version: 1.0` as strings
\t * while still supporting arrays and nested mappings such as `references`.
\t */
\tprivate parseYamlManifest(yaml: string): SkillManifest | null {
\t\ttry {
\t\t\tconst parsed = loadYaml(yaml, { schema: FAILSAFE_SCHEMA });
\t\t\tif (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return null;
\t\t\treturn this.buildManifest(parsed as Record<string, unknown>);
\t\t} catch {
\t\t\treturn null;
\t\t}
\t}
'''
          loader, count = parser_pattern.subn(parser_replacement, loader, count=1)
          if count != 1:
              raise SystemExit(f"SkillLoader parser block replacements: {count}")

          scalar_pattern = re.compile(
              r'\n\t/\*\* Parse version as an opaque string[\s\S]*?(?=\n\t/\*\* Strip the frontmatter)',
          )
          loader, count = scalar_pattern.subn('', loader, count=1)
          if count != 1:
              raise SystemExit(f"SkillLoader scalar helper replacements: {count}")

          old_validation = '''\t\tif (Array.isArray(values.allowedTools)) {
\t\t\tmanifest.allowedTools = values.allowedTools as string[];
\t\t}
\t\tif (values.references && typeof values.references === "object") {
\t\t\tmanifest.references = values.references as Record<string, string>;
\t\t}'''
          new_validation = '''\t\tif (Array.isArray(values.allowedTools)) {
\t\t\tconst allowedTools = values.allowedTools.filter((tool): tool is string => typeof tool === "string");
\t\t\tif (allowedTools.length > 0) manifest.allowedTools = allowedTools;
\t\t}
\t\tif (values.references && typeof values.references === "object" && !Array.isArray(values.references)) {
\t\t\tconst references: Record<string, string> = {};
\t\t\tfor (const [name, referencePath] of Object.entries(values.references as Record<string, unknown>)) {
\t\t\t\tif (typeof referencePath === "string") references[name] = referencePath;
\t\t\t}
\t\t\tif (Object.keys(references).length > 0) manifest.references = references;
\t\t}'''
          if loader.count(old_validation) != 1:
              raise SystemExit("SkillLoader validation anchor mismatch")
          loader_path.write_text(loader.replace(old_validation, new_validation, 1))

          writer_path = Path("src/core/skills/SkillWriter.ts")
          writer = writer_path.read_text()
          if writer.count('lines.push("tools:");') != 1:
              raise SystemExit("SkillWriter tools anchor mismatch")
          writer_path.write_text(writer.replace('lines.push("tools:");', 'lines.push("allowedTools:");', 1))

          loop_path = Path("src/core/loop/AutonomousLoop.ts")
          loop = loop_path.read_text()
          field_anchor = '\tprivate abortController: AbortController | null = null;'
          if 'private lastObservedUrl:' not in loop:
              if loop.count(field_anchor) != 1:
                  raise SystemExit("AutonomousLoop field anchor mismatch")
              loop = loop.replace(field_anchor, field_anchor + '\n\tprivate lastObservedUrl: string | null = null;', 1)

          reset_anchor = '\t\tthis.abortController = new AbortController();'
          if '\t\tthis.lastObservedUrl = null;' not in loop:
              if loop.count(reset_anchor) != 1:
                  raise SystemExit("AutonomousLoop reset anchor mismatch")
              loop = loop.replace(reset_anchor, reset_anchor + '\n\t\tthis.lastObservedUrl = null;', 1)

          observe_anchor = '\t\t\tpageState = await this.controller.getState("agent");'
          if '\t\t\tthis.lastObservedUrl = pageState.url;' not in loop:
              if loop.count(observe_anchor) != 1:
                  raise SystemExit("AutonomousLoop observation anchor mismatch")
              loop = loop.replace(observe_anchor, observe_anchor + '\n\t\t\tthis.lastObservedUrl = pageState.url;', 1)

          old_hostname = '''\t\t\t\tconst hostname =
\t\t\t\t\tthis.state.iterations.length > 0
\t\t\t\t\t\t? this.extractHostname(this.state.iterations.at(-1)?.plan?.assessment ?? "")
\t\t\t\t\t\t: "unknown";'''
          new_hostname = '''\t\t\t\tconst hostname = this.lastObservedUrl ? this.extractHostname(this.lastObservedUrl) : "unknown";'''
          if loop.count(old_hostname) != 1:
              raise SystemExit("AutonomousLoop blocker hostname anchor mismatch")
          loop_path.write_text(loop.replace(old_hostname, new_hostname, 1))
          PY
      - run: npm ci
      - run: npm run build
      - name: Run focused skill regressions
        run: npx vitest run --config vitest.config.unit.ts tests/unit/skills/SkillLoaderNumericVersion.test.ts tests/unit/skills/SkillManifestContract.test.ts tests/unit/loop/AutonomousLoopSkills.test.ts tests/unit/loop/AutonomousLoopGeneratedSkillDomain.test.ts tests/unit/SkillLoader.test.ts tests/unit/skills/SkillWriter.test.ts
      - name: Commit runtime fixes
        run: |
          if git diff --quiet -- src/core/skills/SkillLoader.ts src/core/skills/SkillWriter.ts src/core/loop/AutonomousLoop.ts; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/skills/SkillLoader.ts src/core/skills/SkillWriter.ts src/core/loop/AutonomousLoop.ts
          git commit -m "fix: align generated skills with manifest contract"
          git push origin HEAD:fix/skill-manifest-contract
