name: Sync corrected relaunch regression

on:
  push:
    branches:
      - perf/error-path-fast-fail-v2
    paths:
      - .github/workflows/sync-relaunch-test-perf.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/error-path-fast-fail-v2
      - name: Sync corrected relaunch regression
        run: python3 .github/scripts/sync_relaunch_test_perf.py
      - name: Commit test and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/BrowserManager.test.ts
          git rm .github/workflows/sync-relaunch-test-perf.yml .github/scripts/sync_relaunch_test_perf.py
          git commit -m "test: sync hash-tracked relaunch regression"
          git push origin HEAD:perf/error-path-fast-fail-v2
