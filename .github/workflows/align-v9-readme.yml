name: Align v9 README

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/v9-readme-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Align README terminology with v9
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          replacements = {
            'full AX-tree perception': 'browser-computed ARIA perception with geometry',
            'Every action returns a structured JSON contract: AX-Tree, DOM state, console output, network events, and visual diffs': 'Every action returns a structured JSON contract: ARIA semantics with geometry, DOM state, console output, network events, and visual diffs',
            '✓ AX-Tree, console, network, bugs': '✓ ARIA state, console, network, bugs',
            'Talox ships two browser automation packages:': 'Talox pins its Playwright runtime packages together:',
            '| **playwright-core** | Chromium automation engine | All core automation: navigating, clicking, typing, AX-tree collection, console/network interception. Uses system Chrome for real browser fingerprint. |': '| **playwright** | Managed Playwright runtime | Keeps Playwright-managed browser binaries and CLI tooling aligned with the Talox runtime. |\n| **playwright-core** | Browser automation engine | Core automation, modern ARIA state collection, console/network interception, and system-Chrome control. |',
            'Talox uses `playwright-core` with `channel: "chrome"` for maximum stealth — system Chrome provides a real browser fingerprint.': 'Talox keeps `playwright` and `playwright-core` on the same version. System Chrome can be selected for a real installed-browser fingerprint, while Playwright-managed Chromium remains supported for CI, Docker, and portable environments.'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected README text: {old}')
              s = s.replace(old, new)
          migration = '  ·\n  <a href="./docs/V9-MIGRATION.md">v9 Migration</a>\n'
          anchor = '  ·\n  <a href="./CHANGELOG.md">Changelog</a>\n'
          if 'V9-MIGRATION.md' not in s:
              s = s.replace(anchor, migration + anchor)
          p.write_text(s)
      - run: npm run build
      - run: npm run typecheck
      - name: Remove helper and commit validated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/align-v9-readme.yml
          git add README.md
          git commit -m "docs: align README with v9 runtime"
          git push origin HEAD:docs/v9-readme-alignment
