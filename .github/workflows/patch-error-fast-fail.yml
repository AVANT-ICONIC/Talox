name: Patch error-path fast fail

on:
  push:
    branches:
      - perf/error-path-fast-fail
    paths:
      - .github/workflows/patch-error-fast-fail.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/error-path-fast-fail
      - name: Apply fast-fail patch
        run: python3 .github/scripts/patch_error_fast_fail.py
      - name: Commit patch and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/BrowserManager.ts src/core/InteractionReliability.ts tests/unit/InteractionReliability.test.ts tests/core/error-paths.test.ts
          git rm .github/workflows/patch-error-fast-fail.yml .github/scripts/patch_error_fast_fail.py
          git commit -m "perf: fail fast on deterministic browser errors"
          git push origin HEAD:perf/error-path-fast-fail
