name: MCP Dependency Bootstrap

on:
  push:
    branches:
      - feat/mcp-server
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message || '', 'feat(mcp): add MCP v2 dependencies') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/mcp-server

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Add MCP v2 dependencies and Node floor
        run: |
          npm install --save --package-lock-only --ignore-scripts @modelcontextprotocol/server@^2.0.0 zod@^4.3.6
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.engines = { ...(pkg.engines ?? {}), node: '>=20.0.0' };
          pkg.scripts = { ...(pkg.scripts ?? {}), mcp: 'node ./dist/cli/entry.js mcp' };
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Validate generated lockfile
        run: npm ci --ignore-scripts

      - name: Commit generated dependency graph
        run: |
          rm .github/workflows/mcp-deps-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/mcp-deps-bootstrap.yml
          git commit -m "feat(mcp): add MCP v2 dependencies and Node 20 floor"
          git push origin HEAD:feat/mcp-server
