# Temporary branch-only patch runner; removed after the validated fix lands.
name: Browser Detect Fix Temp

on:
  push:
    branches: [fix/playwright-browser-autodetect]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/playwright-browser-autodetect
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply bundled-browser detection fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/core/BrowserManager.ts")
          text = path.read_text()
          anchor = '''\t\t\tif (channel) {
\t\t\t\ttry {
\t\t\t\t\tconst browser = await launcher.launch({ ...options, headless: true });
\t\t\t\t\tawait browser.close();
\t\t\t\t\treturn { path: channel, version: undefined };
\t\t\t\t} catch {
\t\t\t\t\t// Try without channel
\t\t\t\t}
\t\t\t}

\t\t\tfor (const searchPath of searchPaths) {'''
          replacement = '''\t\t\tif (channel) {
\t\t\t\ttry {
\t\t\t\t\tconst browser = await launcher.launch({ ...options, headless: true });
\t\t\t\t\tawait browser.close();
\t\t\t\t\treturn { path: channel, version: undefined };
\t\t\t\t} catch {
\t\t\t\t\t// Try without channel
\t\t\t\t}
\t\t\t} else {
\t\t\t\t// Playwright-managed browsers live outside the fixed system paths below.
\t\t\t\t// A successful default launch is the most reliable proof that the
\t\t\t\t// browser package/cache is actually usable.
\t\t\t\ttry {
\t\t\t\t\tconst browser = await launcher.launch({ timeout: 5000, headless: true });
\t\t\t\t\tconst version = browser.version();
\t\t\t\t\tconst executablePath = launcher.executablePath();
\t\t\t\t\tawait browser.close().catch(() => {});
\t\t\t\t\treturn { path: executablePath, version };
\t\t\t\t} catch {
\t\t\t\t\t// Fall through to explicit system/cache path probing.
\t\t\t\t}
\t\t\t}

\t\t\tfor (const searchPath of searchPaths) {'''
          if text.count(anchor) != 1:
              raise SystemExit(f"BrowserManager patch anchor count: {text.count(anchor)}")
          path.write_text(text.replace(anchor, replacement, 1))
          PY
      - run: npm ci
      - run: npm run build
      - name: Run focused regression
        run: npx vitest run --config vitest.config.unit.ts tests/unit/BrowserManagerBundledDetection.test.ts tests/unit/BrowserManager.test.ts
      - name: Commit runtime fix
        run: |
          if git diff --quiet -- src/core/BrowserManager.ts; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/BrowserManager.ts
          git commit -m "fix: detect Playwright-managed browser executables"
          git push origin HEAD:fix/playwright-browser-autodetect
