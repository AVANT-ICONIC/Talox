name: Skill Fix Temp

on:
  push:
    branches: [fix/single-agent-skill-loading]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/single-agent-skill-loading
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused runtime fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          loop_path = Path("src/core/loop/AutonomousLoop.ts")
          loop = loop_path.read_text()
          old = "\t\tthis.abortController = new AbortController();\n\n\t\t// Navigate to startUrl if provided"
          new = "\t\tthis.abortController = new AbortController();\n\n\t\t// Skills are optional context, but they must be discovered before the first plan.\n\t\t// Reload on every run so a reused loop can see skills added between runs.\n\t\ttry {\n\t\t\tawait this.skillLoader.loadAll();\n\t\t} catch {\n\t\t\t// Skill discovery is non-fatal; autonomous browsing can continue without it.\n\t\t}\n\n\t\t// Navigate to startUrl if provided"
          if loop.count(old) != 1:
              raise SystemExit("AutonomousLoop patch anchor not found exactly once")
          loop_path.write_text(loop.replace(old, new, 1))

          loader_path = Path("src/core/skills/SkillLoader.ts")
          loader = loader_path.read_text()
          old = "\t\t\tvalue: this.parseScalar(val),\n\t\t\tvalueKey: key,"
          new = "\t\t\tvalue: key === \"version\" ? this.parseVersion(val) : this.parseScalar(val),\n\t\t\tvalueKey: key,"
          if loader.count(old) != 1:
              raise SystemExit("SkillLoader value patch anchor not found exactly once")
          loader = loader.replace(old, new, 1)

          marker = "\t/** Parse a scalar YAML value (string, number, boolean). */\n\tprivate parseScalar(val: string): unknown {"
          helper = "\t/** Parse version as an opaque string, preserving values such as unquoted 1.0. */\n\tprivate parseVersion(val: string): string {\n\t\tif ((val.startsWith('\\\"') && val.endsWith('\\\"')) || (val.startsWith(\"'\") && val.endsWith(\"'\"))) {\n\t\t\treturn val.slice(1, -1);\n\t\t}\n\t\treturn val;\n\t}\n\n" + marker
          if loader.count(marker) != 1:
              raise SystemExit("SkillLoader helper patch anchor not found exactly once")
          loader_path.write_text(loader.replace(marker, helper, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run focused regressions
        run: npx vitest run --config vitest.config.unit.ts tests/unit/skills/SkillLoaderNumericVersion.test.ts tests/unit/loop/AutonomousLoopSkills.test.ts
      - name: Commit runtime fixes
        run: |
          if git diff --quiet -- src/core/loop/AutonomousLoop.ts src/core/skills/SkillLoader.ts; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/loop/AutonomousLoop.ts src/core/skills/SkillLoader.ts
          git commit -m "fix: load single-agent skills before planning"
          git push origin HEAD:fix/single-agent-skill-loading
