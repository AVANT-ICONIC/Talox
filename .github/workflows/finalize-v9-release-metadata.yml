name: Finalize v9 release metadata

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/v9-release-metadata-finalize
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Patch current v9 metadata without rewriting history
        shell: python
        run: |
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          s = changelog.read_text()
          old = '- 127 unit test files / 1,959 tests expected after BrowserManager/Xvfb lifecycle, overlap, startup-failure, display-pinning, caller-environment preservation, relaunch, and virtual-display-disable regression coverage; definitive CI validates the exact total before merge.'
          new = '- **127 unit test files / 1,975 unit tests** verified passing on the final v9 release baseline, together with all six browser integration shards, the browser aggregate gate, and Docker build/runtime/sandbox smoke gates.'
          if old not in s:
              raise SystemExit('stale v9 test-count line not found')
          s = s.replace(old, new, 1)
          fixed_anchor = '- **BrowserManager/Xvfb lifecycle hardening** — active managers share one process-level `exit`/`SIGINT` listener pair; Xvfb cleanup registers immediately after spawn, stale child events cannot clear replacement state, concurrent displays are reserved and restored through a process-wide stack, each browser launch is pinned to its manager-owned display without replacing caller-provided environment variables, browser configuration relaunches preserve the live Xvfb process while virtual display remains enabled, and disabling virtual display tears down Xvfb before replacement launch.\n'
          doctor_line = '- **Doctor runtime baseline** — `talox doctor` now enforces the same Node.js 20 minimum as package metadata and derives its upgrade guidance from that shared baseline.\n'
          if doctor_line not in s:
              if fixed_anchor not in s:
                  raise SystemExit('v9 fixed-section anchor not found')
              s = s.replace(fixed_anchor, fixed_anchor + doctor_line, 1)
          changelog.write_text(s)

          agents = Path('AGENTS.md')
          s = agents.read_text()
          replacements = {
              'PageStateCollector.ts       # DOM/AX/network state collection': 'PageStateCollector.ts       # ARIA/DOM/network state collection',
              'SemanticMapper.ts           # AX-tree → structured semantic output': 'SemanticMapper.ts           # Talox nodes → structured semantic output',
              '- **Validation baseline before release:** 127 unit test files / 1,974 unit tests plus all browser integration shards and Docker gates green on the modern ARIA merge.': '- **Validation baseline:** 127 unit test files / 1,975 unit tests plus all six browser integration shards, the browser aggregate gate, and Docker runtime/sandbox gates green.'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing AGENTS text: {old}')
              s = s.replace(old, new, 1)
          agents.write_text(s)
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Verify historical changelog retained
        shell: python
        run: |
          from pathlib import Path
          s = Path('CHANGELOG.md').read_text()
          for marker in ['## [9.0.0]', '## [8.1.0]', '## [8.0.0]', '## [7.7.0]']:
              if marker not in s:
                  raise SystemExit(f'missing historical changelog marker: {marker}')
      - name: Remove helper and commit validated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-v9-release-metadata.yml
          git add CHANGELOG.md AGENTS.md
          git commit -m "docs: finalize v9 release metadata"
          git push origin HEAD:docs/v9-release-metadata-finalize
