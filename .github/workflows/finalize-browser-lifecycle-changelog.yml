name: Finalize browser lifecycle changelog

on:
  push:
    branches:
      - fix/browser-process-cleanup
    paths:
      - .github/workflows/finalize-browser-lifecycle-changelog.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/browser-process-cleanup
      - name: Refresh lifecycle changelog
        run: python3 .github/scripts/finalize_browser_lifecycle_changelog.py
      - name: Commit changelog and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git rm .github/workflows/finalize-browser-lifecycle-changelog.yml .github/scripts/finalize_browser_lifecycle_changelog.py
          git commit -m "docs: refresh browser lifecycle validation summary"
          git push origin HEAD:fix/browser-process-cleanup
