name: Prepare v9 release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v9.0.0
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bump package version
        run: npm version 9.0.0 --no-git-tag-version
      - name: Finalize changelog and status docs
        shell: python
        run: |
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          start_marker = '## [Unreleased]\n\n'
          release_marker = '\n---\n\n## [8.1.0]'
          start = text.index(start_marker) + len(start_marker)
          end = text.index(release_marker, start)
          unreleased_body = text[start:end].strip()
          replacement = (
              '## [Unreleased]\n\n'
              '---\n\n'
              '## [9.0.0] - 2026-08-25\n\n'
              + unreleased_body
              + '\n\n---\n\n## [8.1.0]'
          )
          text = text[:text.index(start_marker)] + replacement + text[end + len(release_marker):]
          changelog.write_text(text)

          agents = Path('AGENTS.md')
          text = agents.read_text()
          anchor = '### Current Status (2026-08-21) — v8.1.0\n'
          status = '''### Current Status (2026-08-25) — v9.0.0\n\n- **Major runtime baseline:** Node.js 20+ is now required to match Playwright 1.62.1.\n- **Modern ARIA state:** browser-computed accessibility roles/names and bounding boxes are the primary `TaloxPageState.nodes` source.\n- **Post-v8.1 platform work:** MCP, community plugins, Replay UI, cross-origin iframe trust, Platform Adapters, and Local VLM are included.\n- **Reliability work:** deterministic browser-error fast paths, BrowserManager/Xvfb lifecycle hardening, profile ownership protection, and synthetic-document collection fast paths are included.\n- **Validation baseline before release:** 127 unit test files / 1,974 unit tests plus all browser integration shards and Docker gates green on the modern ARIA merge.\n\n'''
          if status not in text:
              text = text.replace(anchor, status + anchor)
          agents.write_text(text)
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Commit release prep and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-v9-release.yml
          git add package.json package-lock.json CHANGELOG.md AGENTS.md
          git commit -m "chore: prepare v9.0.0 release"
          git push origin HEAD:release/v9.0.0
