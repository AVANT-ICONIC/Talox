name: Harden Xvfb launch

on:
  push:
    branches:
      - fix/browser-process-cleanup
    paths:
      - .github/workflows/harden-xvfb-launch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/browser-process-cleanup
      - name: Apply Xvfb launch hardening
        run: python3 .github/scripts/harden_xvfb_launch.py
      - name: Commit patch and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/BrowserManager.ts tests/unit/XvfbDisplay.test.ts
          git rm .github/workflows/harden-xvfb-launch.yml .github/scripts/harden_xvfb_launch.py
          git commit -m "fix: pin Chromium to owned Xvfb display"
          git push origin HEAD:fix/browser-process-cleanup
