name: Fix profile relaunch test

on:
  push:
    branches:
      - perf/error-path-fast-fail-v2
    paths:
      - .github/workflows/fix-profile-relaunch-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/error-path-fast-fail-v2
      - name: Fix profile relaunch regression
        run: python3 .github/scripts/fix_profile_relaunch_test.py
      - name: Commit test and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/BrowserManager.test.ts
          git rm .github/workflows/fix-profile-relaunch-test.yml .github/scripts/fix_profile_relaunch_test.py
          git commit -m "test: harden profile relaunch reservation coverage"
          git push origin HEAD:perf/error-path-fast-fail-v2
