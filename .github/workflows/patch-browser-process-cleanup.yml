name: Patch browser process cleanup

on:
  push:
    branches:
      - fix/browser-process-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/browser-process-cleanup
          fetch-depth: 0
      - name: Apply lifecycle and roadmap cleanup
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          path = Path("src/core/BrowserManager.ts")
          text = path.read_text()

          old = '''interface LaunchOptions {
          \theadless: boolean;
          \tbrowserType: BrowserType;
          \tproxy?: { server: string; username?: string; password?: string };
          \tuserDataDir?: string;
          \targs?: string[];
          \textensions?: string[];
          }

          export class BrowserManager {'''
          new = '''interface LaunchOptions {
          \theadless: boolean;
          \tbrowserType: BrowserType;
          \tproxy?: { server: string; username?: string; password?: string };
          \tuserDataDir?: string;
          \targs?: string[];
          \textensions?: string[];
          }

          const processCleanupCallbacks = new Set<() => void>();
          let processCleanupHandlersInstalled = false;

          function runProcessCleanupCallbacks(): void {
          \tconst callbacks = Array.from(processCleanupCallbacks);
          \tprocessCleanupCallbacks.clear();
          \tfor (const cleanup of callbacks) {
          \t\ttry {
          \t\t\tcleanup();
          \t\t} catch {
          \t\t\t/* NOSONAR — process teardown must continue through other managers */
          \t\t}
          \t}
          }

          function ensureProcessCleanupHandlers(): void {
          \tif (processCleanupHandlersInstalled) return;
          \tprocessCleanupHandlersInstalled = true;
          \tprocess.once("exit", runProcessCleanupCallbacks);
          \tprocess.once("SIGINT", () => {
          \t\trunProcessCleanupCallbacks();
          \t\tprocess.exit();
          \t});
          }

          export class BrowserManager {'''
          text = replace_once(text, old, new, "insert shared cleanup registry")

          old = '''\tprivate readonly contexts: Set<BrowserContext> = new Set();

          \t// Xvfb virtual display state'''
          new = '''\tprivate readonly contexts: Set<BrowserContext> = new Set();
          \tprivate readonly processCleanup = () => this.closeAllSync();

          \t// Xvfb virtual display state'''
          text = replace_once(text, old, new, "add stable cleanup callback")

          old = '''
          \t\t// Auto-cleanup on process exit — use once() so multiple instances don't
          \t\t// stack unbounded listeners (avoids MaxListenersExceededWarning in tests).
          \t\tconst exitHandler = () => this.closeAllSync();
          \t\tconst sigintHandler = () => {
          \t\t\tthis.closeAllSync();
          \t\t\tprocess.exit();
          \t\t};
          \t\tprocess.once("exit", exitHandler);
          \t\tprocess.once("SIGINT", sigintHandler);'''
          text = replace_once(text, old, "", "remove per-instance process handlers")

          old = '''\tprivate closeAllSync() {
          \t\t// Synchronous cleanup is limited, but we try our best'''
          new = '''\tprivate registerProcessCleanup(): void {
          \t\tensureProcessCleanupHandlers();
          \t\tprocessCleanupCallbacks.add(this.processCleanup);
          \t}

          \tprivate unregisterProcessCleanupIfIdle(): void {
          \t\tif (this.contexts.size === 0 && this.xvfbProcess === null) {
          \t\t\tprocessCleanupCallbacks.delete(this.processCleanup);
          \t\t}
          \t}

          \tprivate closeAllSync() {
          \t\t// Synchronous cleanup is limited, but we try our best'''
          text = replace_once(text, old, new, "add register/unregister helpers")

          old = '''\tprivate attachCloseHandler(ctx: BrowserContext): void {
          \t\tctx.on("close", () => {
          \t\t\tthis.contexts.delete(ctx);
          \t\t\tif (this.context === ctx) this.context = null;
          \t\t});
          \t}'''
          new = '''\tprivate attachCloseHandler(ctx: BrowserContext): void {
          \t\tctx.on("close", () => {
          \t\t\tthis.contexts.delete(ctx);
          \t\t\tif (this.context === ctx) this.context = null;
          \t\t\tthis.unregisterProcessCleanupIfIdle();
          \t\t});
          \t}'''
          text = replace_once(text, old, new, "unregister on context close")

          old = '''\t\tconst ctx = (await launcher.launchPersistentContext(userDataDir, launchOptions)) as BrowserContext;
          \t\tthis.contexts.add(ctx);
          \t\tthis.attachCloseHandler(ctx);
          \t\treturn ctx;'''
          new = '''\t\tconst ctx = (await launcher.launchPersistentContext(userDataDir, launchOptions)) as BrowserContext;
          \t\tthis.contexts.add(ctx);
          \t\tthis.registerProcessCleanup();
          \t\tthis.attachCloseHandler(ctx);
          \t\treturn ctx;'''
          text = replace_once(text, old, new, "register launched context")

          old = '''\t\tthis.savedDisplayEnv = process.env.DISPLAY;
          \t\tprocess.env.DISPLAY = this.xvfbDisplay;
          \t}'''
          new = '''\t\tthis.savedDisplayEnv = process.env.DISPLAY;
          \t\tprocess.env.DISPLAY = this.xvfbDisplay;
          \t\tthis.registerProcessCleanup();
          \t}'''
          text = replace_once(text, old, new, "register xvfb resource")

          old = '''\t\t\tthis.xvfbDisplay = null;
          \t\t\tthis.savedDisplayEnv = undefined;
          \t\t}
          \t}

          \t/**
          \t * Whether Xvfb is currently running.'''
          new = '''\t\t\tthis.xvfbDisplay = null;
          \t\t\tthis.savedDisplayEnv = undefined;
          \t\t}
          \t\tthis.unregisterProcessCleanupIfIdle();
          \t}

          \t/**
          \t * Whether Xvfb is currently running.'''
          text = replace_once(text, old, new, "unregister after xvfb stop")
          path.write_text(text)

          path = Path("tests/unit/BrowserManager.test.ts")
          text = path.read_text()
          old = '''\t\tit("registers exit handlers on process", () => {
          \t\t\tconst spy = vi.spyOn(process, "once").mockImplementation(() => process);
          \t\t\tnew BrowserManager();
          \t\t\texpect(spy).toHaveBeenCalledWith("exit", expect.any(Function));
          \t\t\texpect(spy).toHaveBeenCalledWith("SIGINT", expect.any(Function));
          \t\t\tspy.mockRestore();
          \t\t});'''
          new = '''\t\tit("does not register process handlers before owning cleanup resources", () => {
          \t\t\tconst spy = vi.spyOn(process, "once").mockImplementation(() => process);
          \t\t\tnew BrowserManager();
          \t\t\texpect(spy).not.toHaveBeenCalledWith("exit", expect.any(Function));
          \t\t\texpect(spy).not.toHaveBeenCalledWith("SIGINT", expect.any(Function));
          \t\t\tspy.mockRestore();
          \t\t});'''
          text = replace_once(text, old, new, "replace constructor listener test")

          marker = '''\tdescribe("launch", () => {
          \t\tit("launches chromium by default and returns a context", async () => {'''
          insert = '''\tdescribe("launch", () => {
          \t\tit("shares one process cleanup listener pair across many active managers", async () => {
          \t\t\tconst onceSpy = vi.spyOn(process, "once").mockImplementation(() => process);
          \t\t\t(chromium.launchPersistentContext as ReturnType<typeof vi.fn>).mockImplementation(async () => createMockContext());
          \t\t\tconst managers = Array.from(
          \t\t\t\t{ length: 12 },
          \t\t\t\t() =>
          \t\t\t\t\tnew BrowserManager({
          \t\t\t\t\t\tbrowser: { preferred: "chromium", headless: true, autoDetect: false } as any,
          \t\t\t\t\t\tsettings: { adaptiveStealthEnabled: false } as any,
          \t\t\t\t\t}),
          \t\t\t);

          \t\t\tfor (const [index, mgr] of managers.entries()) {
          \t\t\t\tawait mgr.launch({
          \t\t\t\t\t...createTestProfile(),
          \t\t\t\t\tid: `listener-test-${index}`,
          \t\t\t\t\tuserDataDir: `/tmp/talox-listener-test-${index}`,
          \t\t\t\t});
          \t\t\t}

          \t\t\texpect(onceSpy.mock.calls.filter(([event]) => event === "exit")).toHaveLength(1);
          \t\t\texpect(onceSpy.mock.calls.filter(([event]) => event === "SIGINT")).toHaveLength(1);
          \t\t\tawait Promise.all(managers.map((mgr) => mgr.closeAll()));
          \t\t\tonceSpy.mockRestore();
          \t\t});

          \t\tit("launches chromium by default and returns a context", async () => {'''
          text = replace_once(text, marker, insert, "add shared listener regression")
          path.write_text(text)

          path = Path("TODO.md")
          text = path.read_text()
          text = text.replace(
              "MCP, community plugins, Replay UI, and cross-origin iframe trust are now on `main`.",
              "MCP, community plugins, Replay UI, cross-origin iframe trust, Platform Adapters, and Local VLM integration are now on `main`.",
          )
          text = replace_once(
              text,
              "- [x] Cross-origin iframe trust detection using existing `trustedDomains`, stable frame identity, and frame-scoped CDP enforcement (#31)\n",
              "- [x] Cross-origin iframe trust detection using existing `trustedDomains`, stable frame identity, and frame-scoped CDP enforcement (#31)\n- [x] Platform Adapters for WordPress, WooCommerce, Shopify, GitHub, and Slack with layered planner guidance (#32)\n- [x] Local VLM integration for Ollama and OpenAI-compatible local multimodal servers, default-local privacy boundary, and redirect replay protection (#33)\n",
              "add post-v8.1 milestones",
          )
          old = '''## 🟢 Next

          - [ ] Platform Adapters: pre-built adapters for common sites and CMSes
          - [ ] Local VLM Integration: optional quantized local vision provider(s) behind the existing `VisualReasoner` interface
          '''
          new = '''## ✅ Planned feature roadmap complete

          All milestones currently listed in `docs/TALOX-ROADMAP.md` have landed on `main`.

          ## 🟢 Maintenance

          - [x] BrowserManager process cleanup: share one process-level `exit`/`SIGINT` listener pair instead of registering listeners per manager instance
          - [ ] Continue reliability, performance, and real-world compatibility work from observed failures and benchmark evidence before defining the next feature tranche
          '''
          text = replace_once(text, old, new, "replace TODO next section")
          text = text.replace(
              "| main after v8.1.0 | **MCP + Plugins + Replay + Iframe Trust** — agent integration, community extension points, offline debugging, trust-gated cross-origin frame execution | 2026-08-24 |",
              "| main after v8.1.0 | **MCP + Plugins + Replay + Iframe Trust + Platform Adapters + Local VLM** — agent integration, extensibility, offline debugging, trust-gated frames, platform-aware planning, local multimodal fallback | 2026-08-24 |",
          )
          path.write_text(text)

          path = Path("docs/TALOX-ROADMAP.md")
          text = path.read_text()
          text = text.replace("## v1: Enhanced Intelligence 🧠", "## v1: Enhanced Intelligence 🧠 ✅ COMPLETE")
          text = text.replace("- [ ] **Local VLM Integration:**", "- [x] **Local VLM Integration:**")
          text = text.replace("## v3: Ecosystem 🔌", "## v3: Ecosystem 🔌 ✅ COMPLETE")
          text = text.replace("- [ ] **Platform Adapters:**", "- [x] **Platform Adapters:**")
          old = '''### Current next target

          **Platform Adapters** is the only remaining v3 ecosystem milestone. The design should build on Talox's existing skills, semantic state, plugins, and controller APIs rather than introduce a second automation abstraction.
          '''
          new = '''### Current next target

          All milestones currently defined in v0 through v3 are complete. The next tranche should be driven by measured reliability, performance, and real-world compatibility gaps rather than adding a parallel automation abstraction without evidence.
          '''
          text = replace_once(text, old, new, "complete roadmap target")
          path.write_text(text)

          path = Path("CHANGELOG.md")
          text = path.read_text()
          marker = "## [8.1.0] - 2026-08-21\n"
          unreleased = '''## [Unreleased]

          ### Added

          - **MCP server** — native dependency-free stdio integration for agent clients, including modern and legacy protocol handshakes.
          - **Community plugins** — isolated rule and vision-detector extension points with validation and failure containment.
          - **Replay UI** — offline interactive timeline and artifact inspection for recorded Talox sessions.
          - **Cross-origin iframe trust** — `trustedDomains`-driven frame trust and trust-gated CDP execution.
          - **Platform Adapters** — built-in WordPress, WooCommerce, Shopify, GitHub, and Slack knowledge layered into planner context without replacing live Talox state.
          - **Local VLM integration** — zero-dependency Ollama and OpenAI-compatible local multimodal providers exposed through `talox/local-vision`.

          ### Fixed

          - **Local VLM redirect privacy boundary** — automatic redirects are disabled so loopback 307/308 responses cannot replay screenshot payloads to remote hosts.
          - **BrowserManager process cleanup listeners** — active managers share one process-level `exit` and `SIGINT` listener pair instead of registering two listeners per instance.

          ### Tests

          - 127 unit test files / 1,950 tests passing after Local VLM security coverage and BrowserManager shared-listener regression coverage.

          ---

          '''
          if marker not in text:
              raise SystemExit("CHANGELOG marker missing")
          text = text.replace(marker, unreleased + marker, 1)
          path.write_text(text)
          PY

          git rm .github/workflows/patch-browser-process-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/BrowserManager.ts tests/unit/BrowserManager.test.ts TODO.md docs/TALOX-ROADMAP.md CHANGELOG.md
          git commit -m "fix: share BrowserManager process cleanup handlers"
          git push origin HEAD:fix/browser-process-cleanup
