name: Benchmark error-path fast paths v4
on:
  push:
    branches: [perf/error-path-fast-fail-v2]
    paths: [.github/workflows/benchmark-error-path-fast-path-v4.yml]
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/error-path-fast-fail-v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Run touched unit tests
        run: npx vitest run --config vitest.config.unit.ts tests/unit/BrowserManager.test.ts tests/unit/BrowserManagerBundledDetection.test.ts tests/unit/InteractionReliability.test.ts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Benchmark error paths
        run: |
          start=$(date +%s)
          npx vitest run --config vitest.config.browser.ts tests/core/error-paths.test.ts
          end=$(date +%s)
          echo "ERROR_PATH_SECONDS=$((end-start))"
      - name: Remove benchmark helper
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/benchmark-error-path-fast-path-v4.yml
          git commit -m "chore: remove temporary error-path benchmark" || true
          git push origin HEAD:perf/error-path-fast-fail-v2
