name: Apply cross-origin active-page patch

on:
  push:
    branches:
      - fix/cross-origin-active-page

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/cross-origin-active-page
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply asserted patch
        run: node scripts/apply-cross-origin-active-page.mjs
      - name: Remove one-shot patch machinery
        run: rm scripts/apply-cross-origin-active-page.mjs .github/workflows/apply-cross-origin-active-page.yml
      - name: Validate diff and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/CrossOriginManager.ts src/core/controller/TaloxController.ts tests/unit/CrossOriginManagerRebindBootstrap.test.ts tests/unit/TaloxControllerCrossOriginPageLifecycle.test.ts scripts/apply-cross-origin-active-page.mjs .github/workflows/apply-cross-origin-active-page.yml
          git commit -m "fix: follow active page for cross-origin iframe tracking"
          git push origin HEAD:fix/cross-origin-active-page
