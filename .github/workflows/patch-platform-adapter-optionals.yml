name: One-shot platform adapter optional-property fix

on:
  push:
    branches:
      - feat/platform-adapters-v8-2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/platform-adapters-v8-2
          fetch-depth: 0
      - name: Patch optional routes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/core/platform/PlatformAdapterRegistry.ts')
          text = path.read_text()
          old = '''\treturn {\n\t\t...adapter,\n\t\tname: adapter.name.trim(),\n\t\tguidance: [...adapter.guidance],\n\t\troutes: adapter.routes ? [...adapter.routes] : undefined,\n\t};'''
          new = '''\tconst normalized: PlatformAdapter = {\n\t\t...adapter,\n\t\tname: adapter.name.trim(),\n\t\tguidance: [...adapter.guidance],\n\t};\n\tif (adapter.routes) normalized.routes = [...adapter.routes];\n\telse delete normalized.routes;\n\treturn normalized;'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''\tlist(): PlatformAdapter[] {\n\t\treturn [...this.adapters.values()].map((adapter) => ({\n\t\t\t...adapter,\n\t\t\tguidance: [...adapter.guidance],\n\t\t\troutes: adapter.routes ? [...adapter.routes] : undefined,\n\t\t}));\n\t}'''
          new = '''\tlist(): PlatformAdapter[] {\n\t\treturn [...this.adapters.values()].map((adapter) => {\n\t\t\tconst copy: PlatformAdapter = { ...adapter, guidance: [...adapter.guidance] };\n\t\t\tif (adapter.routes) copy.routes = [...adapter.routes];\n\t\t\telse delete copy.routes;\n\t\t\treturn copy;\n\t\t});\n\t}'''
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/platform/PlatformAdapterRegistry.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: preserve exact optional adapter properties"
          git push origin HEAD:feat/platform-adapters-v8-2
