name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
    branches: [main, v3]
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:
    inputs:
      grep:
        description: 'Test name filter (e.g. "Gorilla Mail" or "Reddit")'
        required: false
        default: ''

# Cancel superseded runs only when they are the same event on the same ref.
# A push to main must not cancel the nightly real-world run halfway through.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint + Typecheck — runs on every push / PR ──────────────────────────────
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # ─── Unit tests — runs on every push / PR ────────────────────────────────────
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Run unit tests
        run: npm run test:unit

  # ─── Packed package smoke — validate the artifact consumers actually install ─
  package-smoke:
    name: Packed Package Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pack, install, import exports, and run CLI
        run: npm run test:package

  # ─── Browser integration tests — runs on every push / PR ──────────────────────
  # Browser tests remain serial inside each shard. The unusually slow error-path
  # suite has its own runner so a transient browser-launch failure does not force
  # the rest of the root suite to be repeated after ~18 minutes of work.
  browser-shard:
    name: Browser Integration · ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: root
            target: 'tests/core/*.test.ts'
            exclude: 'tests/core/error-paths.test.ts'
          - group: error-paths
            target: 'tests/core/error-paths.test.ts'
            exclude: ''
          - group: loop
            target: 'tests/core/loop/*.test.ts'
            exclude: ''
          - group: controller
            target: 'tests/core/controller/*.test.ts'
            exclude: ''
          - group: observe
            target: 'tests/core/observe/*.test.ts'
            exclude: ''
          - group: smart
            target: 'tests/core/smart/*.test.ts'
            exclude: ''
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser integration shard
        shell: bash
        run: |
          if [ -n "${{ matrix.exclude }}" ]; then
            npx vitest run --config vitest.config.browser.ts ${{ matrix.target }} --exclude ${{ matrix.exclude }}
          else
            npx vitest run --config vitest.config.browser.ts ${{ matrix.target }}
          fi

  browser:
    name: Browser Integration Tests
    needs: browser-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify all browser shards passed
        run: |
          if [ "${{ needs.browser-shard.result }}" != "success" ]; then
            echo "One or more browser integration shards failed or were cancelled."
            exit 1
          fi
          echo "All browser integration shards passed."

  # ─── Real-world tests — nightly full suite in isolated serial shards ──────────
  # Real sites are allowed to be slow or hostile, but one scenario must not consume
  # the entire nightly budget. Shards stay serial to avoid rate-limit/shared-IP
  # pressure while each gets its own runner timeout and diagnostics.
  real-world-shard:
    name: Real-World · ${{ matrix.group }}
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.grep == '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - group: detection
            target: 'tests/real/00-detection-suite.spec.ts'
          - group: disposable-mail
            target: 'tests/real/01-guerrillamail.spec.ts'
          - group: reddit-signup
            target: 'tests/real/02-reddit-signup.spec.ts'
          - group: platforms
            target: 'tests/real/03-reddit-login.spec.ts tests/real/04-x-bot-detection.spec.ts tests/real/05-stackoverflow.spec.ts'
          - group: agents-observe
            target: 'tests/real/06-chatgpt-agent-to-agent.spec.ts tests/real/06b-grok-agent-to-agent.spec.ts tests/real/07-observe-driven-ai.spec.ts'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Restore previous detection baseline
        if: matrix.group == 'detection'
        uses: actions/cache/restore@v5
        with:
          path: tests/real/detection-results.json
          key: talox-detection-results-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            talox-detection-results-${{ runner.os }}-

      - run: npm ci

      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run real-world shard
        run: npx playwright test ${{ matrix.target }}
        env:
          REDDIT_USER: ${{ secrets.REDDIT_USER }}
          REDDIT_PASS: ${{ secrets.REDDIT_PASS }}
          CI: true

      - name: Check detection baseline output
        id: detection-baseline
        if: always() && matrix.group == 'detection'
        shell: bash
        run: |
          if [ -f tests/real/detection-results.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save detection baseline
        if: success() && matrix.group == 'detection' && steps.detection-baseline.outputs.exists == 'true'
        uses: actions/cache/save@v5
        with:
          path: tests/real/detection-results.json
          key: talox-detection-results-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload detection baseline
        if: always() && matrix.group == 'detection' && steps.detection-baseline.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: detection-results-${{ github.run_number }}-${{ github.run_attempt }}
          path: tests/real/detection-results.json
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.group }}-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test videos (failures only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-videos-${{ matrix.group }}-${{ github.run_number }}
          path: test-results/
          retention-days: 3

  # ─── Filtered real-world run — manual targeted diagnostics only ──────────────
  real-world-filtered:
    name: Real-World · filtered
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.grep != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run filtered real-world tests
        run: npx playwright test --grep "${{ github.event.inputs.grep }}"
        env:
          REDDIT_USER: ${{ secrets.REDDIT_USER }}
          REDDIT_PASS: ${{ secrets.REDDIT_PASS }}
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-filtered-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test videos (failures only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-videos-filtered-${{ github.run_number }}
          path: test-results/
          retention-days: 3