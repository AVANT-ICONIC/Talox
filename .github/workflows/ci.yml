name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
    branches: [main, v3]
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:
    inputs:
      grep:
        description: 'Test name filter (e.g. "Gorilla Mail" or "Reddit")'
        required: false
        default: ''

# Cancel superseded runs on the same branch/ref when a newer commit arrives.
# This keeps PR feedback focused on the current head instead of stale intermediates.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint + Typecheck — runs on every push / PR ──────────────────────────────
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # ─── Unit tests — runs on every push / PR ────────────────────────────────────
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Run unit tests
        run: npm run test:unit

  # ─── Browser integration tests — runs on every push / PR ──────────────────────
  # The browser suite is intentionally serial inside each shard because multiple
  # Chromium launches in one Vitest worker can deadlock resources. Separate CI
  # runners let independent test areas execute concurrently without weakening
  # that isolation. The aggregate `browser` job below preserves the stable check
  # name used by branch protection.
  browser-shard:
    name: Browser Integration · ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: root
            target: 'tests/core/*.test.ts'
          - group: loop
            target: 'tests/core/loop/*.test.ts'
          - group: controller
            target: 'tests/core/controller/*.test.ts'
          - group: observe
            target: 'tests/core/observe/*.test.ts'
          - group: smart
            target: 'tests/core/smart/*.test.ts'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser integration shard
        run: npx vitest run --config vitest.config.browser.ts ${{ matrix.target }}

  browser:
    name: Browser Integration Tests
    needs: browser-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify all browser shards passed
        run: |
          if [ "${{ needs.browser-shard.result }}" != "success" ]; then
            echo "One or more browser integration shards failed or were cancelled."
            exit 1
          fi
          echo "All browser integration shards passed."

  # ─── Real-world tests — nightly + manual only ────────────────────────────────
  real-world:
    name: Real-World Tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run real-world tests
        run: |
          if [ -n "${{ github.event.inputs.grep }}" ]; then
            npx playwright test --grep "${{ github.event.inputs.grep }}"
          else
            npx playwright test
          fi
        env:
          REDDIT_USER: ${{ secrets.REDDIT_USER }}
          REDDIT_PASS: ${{ secrets.REDDIT_PASS }}
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test videos (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos-${{ github.run_number }}
          path: test-results/
          retention-days: 3
