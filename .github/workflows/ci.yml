name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
    branches: [main, v3]
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:
    inputs:
      grep:
        description: 'Test name filter (e.g. "Gorilla Mail" or "Reddit")'
        required: false
        default: ''

permissions:
  contents: write

# Cancel superseded runs on the same branch/ref when a newer commit arrives.
# This keeps PR feedback focused on the current head instead of stale intermediates.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Temporary transaction for PR #35. The validated commit restores ci.yml from main.
  pr35-fast-path-transaction:
    name: PR35 Fast-Path Transaction
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/error-path-fast-fail-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/error-path-fast-fail-v2
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply deterministic fast paths
        run: python3 .github/scripts/apply_pr35_fast_path_v2.py
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Focused unit validation
        run: npx vitest run --config vitest.config.unit.ts tests/unit/BrowserManagerBundledDetection.test.ts tests/unit/BrowserManager.test.ts tests/unit/ActionExecutor.test.ts tests/unit/InteractionReliability.test.ts
      - name: Install browser for timing validation
        run: npx playwright install --with-deps chromium
      - name: Validate error paths and record timing
        run: npx vitest run --config vitest.config.browser.ts tests/core/error-paths.test.ts | tee /tmp/error-paths.log
      - name: Commit validated transaction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/apply-pr35-fast-path-v2.yml .github/scripts/apply_pr35_fast_path_v2.py
          git add src/core/InteractionReliability.ts src/core/controller/ActionExecutor.ts src/core/BrowserManager.ts tests/unit/ActionExecutor.test.ts tests/unit/InteractionReliability.test.ts tests/unit/BrowserManagerBundledDetection.test.ts .github/workflows/ci.yml
          git commit -m "perf: skip deterministic browser setup work"
          git push origin HEAD:perf/error-path-fast-fail-v2

  # ─── Lint + Typecheck — runs on every push / PR ──────────────────────────────
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # ─── Unit tests — runs on every push / PR ────────────────────────────────────
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Run unit tests
        run: npm run test:unit

  # ─── Browser integration tests — runs on every push / PR ──────────────────────
  # Browser tests remain serial inside each shard. The unusually slow error-path
  # suite has its own runner so a transient browser-launch failure does not force
  # the rest of the root suite to be repeated after ~18 minutes of work.
  browser-shard:
    name: Browser Integration · ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: root
            target: 'tests/core/*.test.ts'
            exclude: 'tests/core/error-paths.test.ts'
          - group: error-paths
            target: 'tests/core/error-paths.test.ts'
            exclude: ''
          - group: loop
            target: 'tests/core/loop/*.test.ts'
            exclude: ''
          - group: controller
            target: 'tests/core/controller/*.test.ts'
            exclude: ''
          - group: observe
            target: 'tests/core/observe/*.test.ts'
            exclude: ''
          - group: smart
            target: 'tests/core/smart/*.test.ts'
            exclude: ''
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser integration shard
        shell: bash
        run: |
          if [ -n "${{ matrix.exclude }}" ]; then
            npx vitest run --config vitest.config.browser.ts ${{ matrix.target }} --exclude ${{ matrix.exclude }}
          else
            npx vitest run --config vitest.config.browser.ts ${{ matrix.target }}
          fi

  browser:
    name: Browser Integration Tests
    needs: browser-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify all browser shards passed
        run: |
          if [ "${{ needs.browser-shard.result }}" != "success" ]; then
            echo "One or more browser integration shards failed or were cancelled."
            exit 1
          fi
          echo "All browser integration shards passed."

  # ─── Real-world tests — nightly + manual only ────────────────────────────────
  real-world:
    name: Real-World Tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run real-world tests
        run: |
          if [ -n "${{ github.event.inputs.grep }}" ]; then
            npx playwright test --grep "${{ github.event.inputs.grep }}"
          else
            npx playwright test
          fi
        env:
          REDDIT_USER: ${{ secrets.REDDIT_USER }}
          REDDIT_PASS: ${{ secrets.REDDIT_PASS }}
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test videos (failures only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-videos-${{ github.run_number }}
          path: test-results/
          retention-days: 3
