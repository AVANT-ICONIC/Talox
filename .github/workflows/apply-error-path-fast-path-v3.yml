name: Apply error-path fast paths
on:
  push:
    branches: [perf/error-path-fast-fail-v2]
    paths: [.github/workflows/apply-error-path-fast-path-v3.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/error-path-fast-fail-v2
      - name: Apply measured fast paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/core/BrowserManager.ts')
          s = p.read_text()
          old = '''\tprivate resolveBrowserType(browserType?: BrowserType): Promise<BrowserType> | BrowserType {\n\t\tconst actual = browserType || this.config.browser.preferred;\n\t\tif (process.platform !== "darwin" && this.config.browser.autoDetect) {\n\t\t\treturn this.autoDetectBrowser();\n\t\t}\n\t\treturn actual;\n\t}\n'''
          new = '''\tprivate async resolveBrowserType(browserType?: BrowserType): Promise<BrowserType> {\n\t\tconst actual = browserType || this.config.browser.preferred;\n\t\tif (process.platform === "darwin" || !this.config.browser.autoDetect) return actual;\n\n\t\t// The caller already selected a browser type. Probe that browser first rather\n\t\t// than launching every supported browser just to rediscover the same choice.\n\t\t// Full auto-detection remains the fallback when the requested browser is not\n\t\t// actually available.\n\t\tif (this.detectedBrowsers.some((browser) => browser.type === actual)) return actual;\n\t\tconst executable = await this.findBrowser(actual, undefined, this.getSearchPaths());\n\t\tif (executable) {\n\t\t\tthis.detectedBrowsers.push({\n\t\t\t\ttype: actual,\n\t\t\t\texecutablePath: executable.path,\n\t\t\t\tversion: executable.version,\n\t\t\t});\n\t\t\treturn actual;\n\t\t}\n\n\t\treturn this.autoDetectBrowser();\n\t}\n'''
          if old not in s:
              raise SystemExit('BrowserManager resolveBrowserType snippet not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/core/InteractionReliability.ts')
          s = p.read_text()
          needle = '''\t\tlet resolvedSelector = selector;\n\n\t\t// ── Duplicate resolution ─────────────────────────────────────────────────\n'''
          replacement = '''\t\tlet resolvedSelector = selector;\n\n\t\t// Locator count does not wait for a matching element, but it does compile the\n\t\t// selector through Playwright's real selector engine. This makes malformed\n\t\t// selectors fail immediately instead of falling through to page.click/type's\n\t\t// 5 second action timeout.\n\t\ttry {\n\t\t\tawait page.locator(resolvedSelector).count();\n\t\t} catch (error: unknown) {\n\t\t\tif (isSelectorSyntaxError(error)) throw error;\n\t\t}\n\n\t\t// ── Duplicate resolution ─────────────────────────────────────────────────\n'''
          if needle not in s:
              raise SystemExit('InteractionReliability insertion point not found')
          p.write_text(s.replace(needle, replacement, 1))

          p = Path('tests/core/error-paths.test.ts')
          s = p.read_text()
          old = '''\t\ttalox = new TaloxController(tmpDir, {\n\t\t\tsettings: { headed: false, verbosity: 0 },\n\t\t});\n\t\tawait talox.launch("err-timeout", "sandbox", "chromium");\n'''
          new = '''\t\ttalox = new TaloxController(tmpDir, {\n\t\t\tsettings: { headed: false, verbosity: 0, navigationWaitUntil: "load" },\n\t\t});\n\t\tawait talox.launch("err-timeout", "sandbox", "chromium");\n\t\t// This test verifies timeout recovery semantics, not Playwright's 30s default.\n\t\t// Keep the same real hanging connection but make the failure deterministic.\n\t\ttalox._session.getPlaywrightPage()?.setDefaultNavigationTimeout(1_500);\n'''
          if old not in s:
              raise SystemExit('network timeout setup snippet not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/unit/InteractionReliability.test.ts')
          s = p.read_text()
          old = '''\t\toverrides: Partial<{\n\t\t$: (sel: string) => Promise<any>;\n\t\tkeyboard: { press: (key: string) => Promise<void> };\n'''
          new = '''\t\toverrides: Partial<{\n\t\t$: (sel: string) => Promise<any>;\n\t\tlocator: (sel: string) => { count: () => Promise<number> };\n\t\tkeyboard: { press: (key: string) => Promise<void> };\n'''
          if old not in s:
              raise SystemExit('makePage type snippet not found')
          s = s.replace(old, new, 1)
          old = '''\treturn {\n\t\t$: vi.fn().mockResolvedValue(null),\n\t\tkeyboard: { press: vi.fn().mockResolvedValue(undefined) },\n'''
          new = '''\treturn {\n\t\t$: vi.fn().mockResolvedValue(null),\n\t\tlocator: vi.fn().mockReturnValue({ count: vi.fn().mockResolvedValue(0) }),\n\t\tkeyboard: { press: vi.fn().mockResolvedValue(undefined) },\n'''
          if old not in s:
              raise SystemExit('makePage default snippet not found')
          s = s.replace(old, new, 1)
          needle = '''\t\tit("fails immediately when Playwright reports malformed CSS syntax", async () => {\n\t\t\tconst syntaxError = new Error('Unexpected token "" while parsing css selector "[[[invalid"');\n\t\t\tconst page = makePage({ $: vi.fn().mockRejectedValue(syntaxError) });\n\n\t\t\tawait expect(reliability.resolveBeforeClick(page, "[[[invalid", [])).rejects.toBe(syntaxError);\n\t\t});\n'''
          replacement = needle + '''\n\t\tit("fails before element lookup when locator compilation rejects malformed syntax", async () => {\n\t\t\tconst syntaxError = new Error('Unexpected token "#" while parsing css selector "#"');\n\t\t\tconst lookup = vi.fn().mockResolvedValue(null);\n\t\t\tconst page = makePage({\n\t\t\t\t$: lookup,\n\t\t\t\tlocator: vi.fn().mockReturnValue({ count: vi.fn().mockRejectedValue(syntaxError) }),\n\t\t\t});\n\n\t\t\tawait expect(reliability.resolveBeforeClick(page, "#", [])).rejects.toBe(syntaxError);\n\t\t\texpect(lookup).not.toHaveBeenCalled();\n\t\t});\n'''
          if needle not in s:
              raise SystemExit('syntax unit test insertion point not found')
          p.write_text(s.replace(needle, replacement, 1))

          p = Path('tests/unit/BrowserManagerBundledDetection.test.ts')
          s = p.read_text()
          old = '''const { chromiumLaunch, chromiumClose } = vi.hoisted(() => ({\n\tchromiumLaunch: vi.fn(),\n\tchromiumClose: vi.fn().mockResolvedValue(undefined),\n}));\n'''
          new = '''const { chromiumLaunch, chromiumClose, chromiumPersistentContext, firefoxLaunch, webkitLaunch } = vi.hoisted(() => ({\n\tchromiumLaunch: vi.fn(),\n\tchromiumClose: vi.fn().mockResolvedValue(undefined),\n\tchromiumPersistentContext: vi.fn(),\n\tfirefoxLaunch: vi.fn(),\n\twebkitLaunch: vi.fn(),\n}));\n'''
          if old not in s:
              raise SystemExit('bundled detection hoisted mocks snippet not found')
          s = s.replace(old, new, 1)
          s = s.replace('''\t\tlaunchPersistentContext: vi.fn(),\n\t},\n\tfirefox: {\n\t\tlaunch: vi.fn().mockRejectedValue(new Error("not installed")),\n''', '''\t\tlaunchPersistentContext: chromiumPersistentContext,\n\t},\n\tfirefox: {\n\t\tlaunch: firefoxLaunch,\n''', 1)
          s = s.replace('''\twebkit: {\n\t\tlaunch: vi.fn().mockRejectedValue(new Error("not installed")),\n''', '''\twebkit: {\n\t\tlaunch: webkitLaunch,\n''', 1)
          old = '''\t\tchromiumClose.mockResolvedValue(undefined);\n\t\tchromiumLaunch.mockImplementation(async (options?: { channel?: string }) => {\n'''
          new = '''\t\tchromiumClose.mockResolvedValue(undefined);\n\t\tchromiumPersistentContext.mockResolvedValue({\n\t\t\tclose: vi.fn().mockResolvedValue(undefined),\n\t\t\ton: vi.fn(),\n\t\t});\n\t\tfirefoxLaunch.mockRejectedValue(new Error("not installed"));\n\t\twebkitLaunch.mockRejectedValue(new Error("not installed"));\n\t\tchromiumLaunch.mockImplementation(async (options?: { channel?: string }) => {\n'''
          if old not in s:
              raise SystemExit('bundled detection beforeEach snippet not found')
          s = s.replace(old, new, 1)
          insert = '''\n\tit("probes the requested bundled Chromium without launching unrelated browser detectors", async () => {\n\t\tconst originalDisplay = process.env.DISPLAY;\n\t\tprocess.env.DISPLAY = ":talox-unit";\n\t\ttry {\n\t\t\tconst manager = new BrowserManager({\n\t\t\t\tbrowser: { autoDetect: true, preferred: "chromium", headless: true } as any,\n\t\t\t\tsettings: { virtualDisplay: false, adaptiveStealthEnabled: false } as any,\n\t\t\t});\n\t\t\tawait manager.launch(\n\t\t\t\t{\n\t\t\t\t\tid: "targeted-detect",\n\t\t\t\t\tclass: "sandbox",\n\t\t\t\t\tpurpose: "test",\n\t\t\t\t\tuserDataDir: "/tmp/talox-targeted-detect",\n\t\t\t\t\tmetadata: { createdAt: new Date().toISOString(), lastUsed: new Date().toISOString() },\n\t\t\t\t},\n\t\t\t\tfalse,\n\t\t\t\t"chromium",\n\t\t\t);\n\n\t\t\texpect(chromiumLaunch).toHaveBeenCalledTimes(1);\n\t\t\texpect(firefoxLaunch).not.toHaveBeenCalled();\n\t\t\texpect(webkitLaunch).not.toHaveBeenCalled();\n\t\t\tawait manager.close();\n\t\t} finally {\n\t\t\tif (originalDisplay === undefined) delete process.env.DISPLAY;\n\t\t\telse process.env.DISPLAY = originalDisplay;\n\t\t}\n\t});\n'''
          marker = '\n});\n'
          idx = s.rfind(marker)
          if idx < 0:
              raise SystemExit('bundled detection describe end not found')
          s = s[:idx] + insert + s[idx:]
          p.write_text(s)
          PY
      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-error-path-fast-path-v3.yml
          git add src/core/BrowserManager.ts src/core/InteractionReliability.ts tests/core/error-paths.test.ts tests/unit/InteractionReliability.test.ts tests/unit/BrowserManagerBundledDetection.test.ts
          git commit -m "perf: avoid deterministic error-path waits"
          git push origin HEAD:perf/error-path-fast-fail-v2
