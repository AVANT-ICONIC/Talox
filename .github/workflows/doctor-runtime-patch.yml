name: Doctor Runtime Patch Helper

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/doctor-runtime-playwright'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Patch doctor runtime dependency checks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/cli/doctor.ts",
              '''async function checkPlaywrightInstalled(): Promise<DoctorCheck> {
\ttry {
\t\tconst modPath = require.resolve("@playwright/test");
\t\tlet version = "unknown";
\t\ttry {
\t\t\tconst pkgPath = require.resolve("@playwright/test/package.json");
\t\t\tconst pkg = JSON.parse(readFileSync(pkgPath, "utf-8"));
\t\t\tversion = pkg.version ?? "unknown";
\t\t} catch {
\t\t\t// Ignored: version detection is best-effort
\t\t}
\t\tconst dir = modPath.split("/").slice(0, -2).join("/");
\t\treturn { name: "Playwright installed", status: "ok", message: `v${version} (${dir})` };
\t} catch {
\t\t// Ignored: @playwright/test not found, report as error below
\t\treturn {
\t\t\tname: "Playwright installed",
\t\t\tstatus: "error",
\t\t\tmessage: "@playwright/test not found",
\t\t\tfixHint: "npm install -D @playwright/test",
\t\t};
\t}
}
''',
              '''async function checkPlaywrightInstalled(): Promise<DoctorCheck> {
\ttry {
\t\tconst modPath = require.resolve("playwright-core");
\t\tlet version = "unknown";
\t\ttry {
\t\t\tconst pkgPath = require.resolve("playwright-core/package.json");
\t\t\tconst pkg = JSON.parse(readFileSync(pkgPath, "utf-8"));
\t\t\tversion = pkg.version ?? "unknown";
\t\t} catch {
\t\t\t// Ignored: version detection is best-effort
\t\t}
\t\tconst dir = modPath.split("/").slice(0, -2).join("/");
\t\treturn { name: "Playwright runtime", status: "ok", message: `v${version} (${dir})` };
\t} catch {
\t\treturn {
\t\t\tname: "Playwright runtime",
\t\t\tstatus: "error",
\t\t\tmessage: "playwright-core not found",
\t\t\tfixHint: "npm install playwright-core",
\t\t};
\t}
}
''',
          )

          replace_once(
              "tests/unit/cli/doctor.test.ts",
              '{ name: "Playwright installed", status: "ok", message: "v1.58.2" },',
              '{ name: "Playwright runtime", status: "ok", message: "v1.58.2" },',
          )
          replace_once(
              "tests/unit/cli/doctor.test.ts",
              '''\t\t\t{
\t\t\t\tname: "Playwright installed",
\t\t\t\tstatus: "error",
\t\t\t\tmessage: "@playwright/test not found",
\t\t\t\tfixHint: "npm install -D @playwright/test",
\t\t\t},''',
              '''\t\t\t{
\t\t\t\tname: "Playwright runtime",
\t\t\t\tstatus: "error",
\t\t\t\tmessage: "playwright-core not found",
\t\t\t\tfixHint: "npm install playwright-core",
\t\t\t},''',
          )
          replace_once(
              "tests/unit/cli/doctor.test.ts",
              'expect(output).toContain("npm install -D @playwright/test");',
              'expect(output).toContain("npm install playwright-core");',
          )
          PY

      - name: Commit doctor fix
        run: |
          if git diff --quiet; then
            echo "Doctor patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cli/doctor.ts tests/unit/cli/doctor.test.ts
          git commit -m "fix(doctor): check the production Playwright runtime"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
