name: Apply issue 147 patch

on:
  push:
    branches:
      - fix/session-video-active-page
    paths:
      - .github/workflows/apply-issue-147-patch.yml
      - .github/scripts/apply-issue-147-patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/session-video-active-page
          fetch-depth: 0
      - name: Apply exact video retarget patch
        run: python .github/scripts/apply-issue-147-patch.py
      - name: Commit patch
        run: |
          git rm .github/workflows/apply-issue-147-patch.yml .github/scripts/apply-issue-147-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/VideoRecorder.ts src/core/controller/TaloxController.ts
          git commit -m "fix: follow active page in session video recording"
          git push origin HEAD:fix/session-video-active-page
