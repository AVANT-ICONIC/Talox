name: Patch Xvfb ownership race

on:
  push:
    branches: [fix/browser-process-cleanup]
    paths:
      - .github/workflows/patch-xvfb-ownership.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/browser-process-cleanup
      - name: Apply ownership-safe Xvfb cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manager = Path('src/core/BrowserManager.ts')
          text = manager.read_text()
          pattern = re.compile(r'\tasync startXvfb\(\): Promise<void> \{.*?\n\t/\*\*\n\t \* Whether Xvfb is currently running\.', re.S)
          replacement = r'''\tprivate releaseXvfbOwnership(
\t\tchild: ChildProcess,
\t\tdisplay: string,
\t\tsavedDisplayEnv: string | undefined,
\t\tterminate: boolean,
\t): void {
\t\t// Child events can arrive after a failed start has already been retried.
\t\t// Only the process that still owns the manager state may clear it.
\t\tif (this.xvfbProcess !== child) return;

\t\tif (terminate) {
\t\t\ttry {
\t\t\t\tchild.kill("SIGTERM");
\t\t\t} catch {
\t\t\t\t/* NOSONAR — process may already be gone */
\t\t\t}
\t\t}
\n\t\tthis.xvfbProcess = null;
\t\tif (this.xvfbDisplay === display) {
\t\t\tif (savedDisplayEnv !== undefined) {
\t\t\t\tprocess.env.DISPLAY = savedDisplayEnv;
\t\t\t} else {
\t\t\t\tdelete process.env.DISPLAY;
\t\t\t}
\t\t\tthis.xvfbDisplay = null;
\t\t\tthis.savedDisplayEnv = undefined;
\t\t}
\t\tthis.unregisterProcessCleanupIfIdle();
\t}

\tasync startXvfb(): Promise<void> {
\t\tif (process.platform !== "linux") {
\t\t\tthrow new Error("Xvfb virtual display is only supported on Linux.");
\t\t}
\t\tif (this.xvfbProcess) {
\t\t\treturn; // already running
\t\t}

\t\tconst xvfbPath = BrowserManager.findXvfb();
\t\tif (!xvfbPath) {
\t\t\tthrow new Error("Xvfb not found. Install it with: sudo apt install xvfb");
\t\t}

\t\tconst displayNum = BrowserManager.findFreeDisplay();
\t\tconst display = `:${displayNum}`;
\t\tconst savedDisplayEnv = process.env.DISPLAY;
\t\tthis.xvfbDisplay = display;
\t\tthis.savedDisplayEnv = savedDisplayEnv;

\t\tconst child = spawn(xvfbPath, [display, "-screen", "0", "1280x720x24", "-ac", "-nolisten", "tcp"], {
\t\t\tstdio: "ignore",
\t\t\tdetached: false,
\t\t});
\t\tthis.xvfbProcess = child;
\t\t// Register as soon as the child exists. The readiness wait below must not
\t\t// leave a SIGINT/process-exit window where Xvfb can be orphaned.
\t\tthis.registerProcessCleanup();

\t\tawait new Promise<void>((resolve, reject) => {
\t\t\tlet settled = false;
\t\t\tconst timeout = setTimeout(() => {
\t\t\t\tif (settled) return;
\t\t\t\tsettled = true;
\t\t\t\tresolve();
\t\t\t}, 500);

\t\t\tconst failStartup = (error: Error) => {
\t\t\t\tif (settled) return;
\t\t\t\tsettled = true;
\t\t\t\tclearTimeout(timeout);
\t\t\t\tthis.releaseXvfbOwnership(child, display, savedDisplayEnv, true);
\t\t\t\treject(error);
\t\t\t};

\t\t\tchild.on("error", (err) => {
\t\t\t\tif (!settled) {
\t\t\t\t\tfailStartup(new Error(`Failed to start Xvfb: ${err.message}`));
\t\t\t\t\treturn;
\t\t\t\t}
\t\t\t\tthis.releaseXvfbOwnership(child, display, savedDisplayEnv, false);
\t\t\t});

\t\t\tchild.on("exit", (code, signal) => {
\t\t\t\tif (!settled) {
\t\t\t\t\tconst detail = code !== null ? `code ${code}` : `signal ${signal ?? "unknown"}`;
\t\t\t\t\tfailStartup(new Error(`Xvfb exited before readiness with ${detail}`));
\t\t\t\t\treturn;
\t\t\t\t}
\t\t\t\tthis.releaseXvfbOwnership(child, display, savedDisplayEnv, false);
\t\t\t});
\t\t});

\t\t// A stop or child event can race the readiness timer. Do not publish a
\t\t// DISPLAY value unless this exact child still owns the state.
\t\tif (this.xvfbProcess !== child) {
\t\t\tthrow new Error("Xvfb startup was interrupted before readiness.");
\t\t}
\t\tprocess.env.DISPLAY = display;
\t}

\t/**
\t * Kill the Xvfb process and restore the original DISPLAY environment.
\t */
\tstopXvfb(): void {
\t\tconst child = this.xvfbProcess;
\t\tconst display = this.xvfbDisplay;
\t\tconst savedDisplayEnv = this.savedDisplayEnv;

\t\tif (child && display) {
\t\t\tthis.releaseXvfbOwnership(child, display, savedDisplayEnv, true);
\t\t\treturn;
\t\t}

\t\tif (child) {
\t\t\ttry {
\t\t\t\tchild.kill("SIGTERM");
\t\t\t} catch {
\t\t\t\t/* NOSONAR — process may have already exited */
\t\t\t}
\t\t\tthis.xvfbProcess = null;
\t\t}
\t\tif (display) {
\t\t\tif (savedDisplayEnv !== undefined) {
\t\t\t\tprocess.env.DISPLAY = savedDisplayEnv;
\t\t\t} else {
\t\t\t\tdelete process.env.DISPLAY;
\t\t\t}
\t\t\tthis.xvfbDisplay = null;
\t\t\tthis.savedDisplayEnv = undefined;
\t\t}
\t\tthis.unregisterProcessCleanupIfIdle();
\t}

\t/**
\t * Whether Xvfb is currently running.'''
          updated, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'BrowserManager replacement count={count}')
          manager.write_text(updated)

          tests = Path('tests/unit/XvfbDisplay.test.ts')
          test_text = tests.read_text()
          old = '''\t\t\tit("registers cleanup immediately after spawn and removes it when startup fails", async () => {
\t\t\t\tmockPlatform("linux");
\t\t\t\t(fs.accessSync as ReturnType<typeof vi.fn>).mockImplementation((p: string) => {
\t\t\t\t\tif (p === "/usr/bin/Xvfb") return;
\t\t\t\t\tthrow new Error("not found");
\t\t\t\t});

\t\t\t\tconst mock = createMockChildProcess();
\t\t\t\tmockSpawn.mockReturnValue(mock.process);
\t\t\t\tconst onceSpy = vi.spyOn(process, "once").mockImplementation(() => process);
\t\t\t\tconst mgr = new BrowserManager();
\t\t\t\tconst stopSpy = vi.spyOn(mgr, "stopXvfb");

\t\t\t\tconst promise = mgr.startXvfb();
\t\t\t\tconst exitRegistration = onceSpy.mock.calls.find(([event]) => event === "exit");
\t\t\t\texpect(mockSpawn).toHaveBeenCalledTimes(1);
\t\t\t\texpect(exitRegistration).toBeDefined();
\t\t\t\texpect(onceSpy.mock.calls.some(([event]) => event === "SIGINT")).toBe(true);

\t\t\t\tmock.triggerError(new Error("spawn failed"));
\t\t\t\tawait expect(promise).rejects.toThrow("Failed to start Xvfb");
\t\t\t\texpect(stopSpy).toHaveBeenCalledTimes(1);

\t\t\t\tstopSpy.mockClear();
\t\t\t\tconst exitHandler = exitRegistration?.[1] as (() => void) | undefined;
\t\t\t\texitHandler?.();
\t\t\t\texpect(stopSpy).not.toHaveBeenCalled();
\t\t\t\tonceSpy.mockRestore();
\t\t\t});
'''
          new = '''\t\t\tit("registers cleanup immediately after spawn and removes it when startup fails", async () => {
\t\t\t\tmockPlatform("linux");
\t\t\t\t(fs.accessSync as ReturnType<typeof vi.fn>).mockImplementation((p: string) => {
\t\t\t\t\tif (p === "/usr/bin/Xvfb") return;
\t\t\t\t\tthrow new Error("not found");
\t\t\t\t});

\t\t\t\tconst mock = createMockChildProcess();
\t\t\t\tmockSpawn.mockReturnValue(mock.process);
\t\t\t\tconst onceSpy = vi.spyOn(process, "once").mockImplementation(() => process);
\t\t\t\tconst mgr = new BrowserManager();

\t\t\t\tconst promise = mgr.startXvfb();
\t\t\t\tconst exitRegistration = onceSpy.mock.calls.find(([event]) => event === "exit");
\t\t\t\texpect(mockSpawn).toHaveBeenCalledTimes(1);
\t\t\t\texpect(exitRegistration).toBeDefined();
\t\t\t\texpect(onceSpy.mock.calls.some(([event]) => event === "SIGINT")).toBe(true);

\t\t\t\tmock.triggerError(new Error("spawn failed"));
\t\t\t\tawait expect(promise).rejects.toThrow("Failed to start Xvfb");
\t\t\t\texpect(mgr.isXvfbRunning()).toBe(false);
\t\t\t\tconst killCount = mockKill.mock.calls.length;

\t\t\t\tconst exitHandler = exitRegistration?.[1] as (() => void) | undefined;
\t\t\t\texitHandler?.();
\t\t\t\texpect(mockKill).toHaveBeenCalledTimes(killCount);
\t\t\t\tonceSpy.mockRestore();
\t\t\t});

\t\t\tit("ignores a delayed exit from a failed child after a retry owns Xvfb", async () => {
\t\t\t\tmockPlatform("linux");
\t\t\t\t(fs.accessSync as ReturnType<typeof vi.fn>).mockImplementation((p: string) => {
\t\t\t\t\tif (p === "/usr/bin/Xvfb") return;
\t\t\t\t\tthrow new Error("not found");
\t\t\t\t});

\t\t\t\tconst first = createMockChildProcess();
\t\t\t\tconst second = createMockChildProcess();
\t\t\t\tmockSpawn.mockReturnValueOnce(first.process).mockReturnValueOnce(second.process);
\t\t\t\tconst mgr = new BrowserManager();
\t\t\t\tvi.useFakeTimers();

\t\t\t\tconst firstStart = mgr.startXvfb();
\t\t\t\tfirst.triggerError(new Error("first spawn failed"));
\t\t\t\tawait expect(firstStart).rejects.toThrow("Failed to start Xvfb");

\t\t\t\tconst secondStart = mgr.startXvfb();
\t\t\t\texpect(mgr.isXvfbRunning()).toBe(true);
\t\t\t\tfirst.triggerExit(1);
\t\t\t\texpect(mgr.isXvfbRunning()).toBe(true);

\t\t\t\tawait vi.advanceTimersByTimeAsync(600);
\t\t\t\tawait secondStart;
\t\t\t\texpect(mgr.isXvfbRunning()).toBe(true);
\t\t\t\texpect(process.env.DISPLAY).toMatch(/^:\\d+$/);

\t\t\t\tmgr.stopXvfb();
\t\t\t\tvi.useRealTimers();
\t\t\t});
'''
          if old not in test_text:
              raise SystemExit('Expected Xvfb cleanup regression block not found')
          tests.write_text(test_text.replace(old, new, 1))
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/BrowserManager.ts tests/unit/XvfbDisplay.test.ts
          git rm .github/workflows/patch-xvfb-ownership.yml
          git commit -m "fix: bind Xvfb cleanup to owning process"
          git push origin HEAD:fix/browser-process-cleanup
