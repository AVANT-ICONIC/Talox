name: Patch Xvfb ownership race

on:
  push:
    branches:
      - fix/browser-process-cleanup
    paths:
      - .github/workflows/patch-xvfb-ownership.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/browser-process-cleanup
      - name: Apply ownership-safe Xvfb cleanup
        run: python3 .github/scripts/patch_xvfb_ownership.py
      - name: Commit patch and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/BrowserManager.ts tests/unit/XvfbDisplay.test.ts
          git rm .github/workflows/patch-xvfb-ownership.yml .github/scripts/patch_xvfb_ownership.py
          git commit -m "fix: bind Xvfb cleanup to owning process"
          git push origin HEAD:fix/browser-process-cleanup
