name: Chromium Sandbox Patch Helper

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/chromium-sandbox-mode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply sandbox hardening slice
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/core/BrowserManager.ts",
              '\t\tautoDetect: boolean;\n\t\tpreferred: BrowserType;\n\t\theadless: boolean;\n',
              '\t\tautoDetect: boolean;\n\t\tpreferred: BrowserType;\n\t\theadless: boolean;\n\t\tchromiumSandbox: boolean;\n',
          )
          replace_once(
              "src/core/BrowserManager.ts",
              '\t\tautoDetect: true,\n\t\tpreferred: "chromium",\n\t\theadless: true,\n',
              '\t\tautoDetect: true,\n\t\tpreferred: "chromium",\n\t\theadless: true,\n\t\tchromiumSandbox: false,\n',
          )
          replace_once(
              "src/core/BrowserManager.ts",
              '\tif (process.env.TALOX_HEADLESS === "false") {\n\t\tcfg.browser.headless = false;\n\t}\n\treturn cfg;\n',
              '\tif (process.env.TALOX_HEADLESS === "false") {\n\t\tcfg.browser.headless = false;\n\t}\n\tif (process.env.TALOX_CHROMIUM_SANDBOX === "true") {\n\t\tcfg.browser.chromiumSandbox = true;\n\t} else if (process.env.TALOX_CHROMIUM_SANDBOX === "false") {\n\t\tcfg.browser.chromiumSandbox = false;\n\t}\n\treturn cfg;\n',
          )
          replace_once(
              "src/core/BrowserManager.ts",
              '\tprivate buildLaunchOptions(extraOptions: any): any {\n\t\tconst effectiveHeadless = extraOptions?.headless ?? this.config.browser.headless;\n\t\tconst isAdaptive = this.config.settings.adaptiveStealthEnabled !== false;\n',
              '\tprivate buildLaunchOptions(extraOptions: any, actualBrowserType: BrowserType): any {\n\t\tconst effectiveHeadless = extraOptions?.headless ?? this.config.browser.headless;\n\t\tconst isAdaptive = this.config.settings.adaptiveStealthEnabled !== false;\n\t\tconst chromiumSandbox =\n\t\t\tactualBrowserType === "chromium"\n\t\t\t\t? (extraOptions?.chromiumSandbox ?? this.config.browser.chromiumSandbox)\n\t\t\t\t: false;\n',
          )
          replace_once(
              "src/core/BrowserManager.ts",
              '\t\t\targs: [\n\t\t\t\t"--no-sandbox",\n\t\t\t\t"--disable-setuid-sandbox",\n\t\t\t\t"--disable-dev-shm-usage",\n',
              '\t\t\targs: [\n\t\t\t\t...(actualBrowserType === "chromium" && !chromiumSandbox\n\t\t\t\t\t? ["--no-sandbox", "--disable-setuid-sandbox"]\n\t\t\t\t\t: []),\n\t\t\t\t"--disable-dev-shm-usage",\n',
          )
          replace_once(
              "src/core/BrowserManager.ts",
              '\t\t\t// When using Patchright (adaptive stealth), prefer system Chrome over bundled\n',
              '\t\t\t...(actualBrowserType === "chromium" ? { chromiumSandbox } : {}),\n\t\t\t// When using Patchright (adaptive stealth), prefer system Chrome over bundled\n',
          )
          replace_once(
              "src/core/BrowserManager.ts",
              '\t\tconst launchOptions = this.buildLaunchOptions(extraOptions);\n',
              '\t\tconst launchOptions = this.buildLaunchOptions(extraOptions, actualBrowserType);\n',
          )

          replace_once(
              "tests/unit/BrowserManager.test.ts",
              '\t\tit("sets headless to false when TALOX_HEADLESS=false env var is set", () => {\n\t\t\tconst original = process.env.TALOX_HEADLESS;\n\t\t\tprocess.env.TALOX_HEADLESS = "false";\n\t\t\tconst cfg = getDefaultConfig();\n\t\t\texpect(cfg.browser.headless).toBe(false);\n\t\t\tprocess.env.TALOX_HEADLESS = original;\n\t\t});\n',
              '\t\tit("sets headless to false when TALOX_HEADLESS=false env var is set", () => {\n\t\t\tconst original = process.env.TALOX_HEADLESS;\n\t\t\tprocess.env.TALOX_HEADLESS = "false";\n\t\t\tconst cfg = getDefaultConfig();\n\t\t\texpect(cfg.browser.headless).toBe(false);\n\t\t\tprocess.env.TALOX_HEADLESS = original;\n\t\t});\n\n\t\tit("enables Chromium sandbox from TALOX_CHROMIUM_SANDBOX=true", () => {\n\t\t\tconst original = process.env.TALOX_CHROMIUM_SANDBOX;\n\t\t\tprocess.env.TALOX_CHROMIUM_SANDBOX = "true";\n\t\t\tconst cfg = getDefaultConfig();\n\t\t\texpect(cfg.browser.chromiumSandbox).toBe(true);\n\t\t\tif (original === undefined) delete process.env.TALOX_CHROMIUM_SANDBOX;\n\t\t\telse process.env.TALOX_CHROMIUM_SANDBOX = original;\n\t\t});\n',
          )
          replace_once(
              "tests/unit/BrowserManager.test.ts",
              '\t\t\texpect(DEFAULT_CONFIG.browser.headless).toBe(true);\n',
              '\t\t\texpect(DEFAULT_CONFIG.browser.headless).toBe(true);\n\t\t\texpect(DEFAULT_CONFIG.browser.chromiumSandbox).toBe(false);\n',
          )
          replace_once(
              "tests/unit/BrowserManager.test.ts",
              '\t\tit("registers context close handler", async () => {\n',
              '\t\tit("enables Chromium sandbox without unsandboxed launch flags", async () => {\n\t\t\tconst mockCtx = createMockContext();\n\t\t\t(chromium.launchPersistentContext as ReturnType<typeof vi.fn>).mockResolvedValue(mockCtx);\n\t\t\tconst secureManager = new BrowserManager({\n\t\t\t\tbrowser: { preferred: "chromium", headless: true, autoDetect: false, chromiumSandbox: true } as any,\n\t\t\t\tsettings: { adaptiveStealthEnabled: false } as any,\n\t\t\t});\n\n\t\t\tawait secureManager.launch(createTestProfile(), false, "chromium");\n\n\t\t\tconst callArgs = (chromium.launchPersistentContext as ReturnType<typeof vi.fn>).mock.calls[0][1];\n\t\t\texpect(callArgs.chromiumSandbox).toBe(true);\n\t\t\texpect(callArgs.args).not.toContain("--no-sandbox");\n\t\t\texpect(callArgs.args).not.toContain("--disable-setuid-sandbox");\n\t\t\texpect(callArgs.args).toContain("--disable-dev-shm-usage");\n\t\t});\n\n\t\tit("registers context close handler", async () => {\n',
          )

          replace_once(
              "Dockerfile",
              'ENV NODE_ENV=production \\\n    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \\\n    HOME=/home/talox\n',
              'ENV NODE_ENV=production \\\n    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \\\n    TALOX_CHROMIUM_SANDBOX=true \\\n    HOME=/home/talox\n',
          )

          replace_once(
              "docs/DOCKER.md",
              'The container process runs as the non-root `talox` user. That reduces host/container damage from a compromised browser process, but it is not yet a complete Chromium sandbox boundary: Talox currently passes Chromium\'s `--no-sandbox` flags in its general launch path. Treat the container itself as the isolation boundary until browser-sandbox hardening lands.\n',
              'The container process runs as the non-root `talox` user and sets `TALOX_CHROMIUM_SANDBOX=true`. In that mode Talox requests Playwright\'s Chromium sandbox and omits the `--no-sandbox` / `--disable-setuid-sandbox` launch flags. Docker CI verifies that the bundled Chromium can start with sandboxing enabled before exercising Talox browser detection.\n\nOutside the official image, Talox keeps Chromium sandboxing disabled by default for compatibility with existing local/container setups. Set `TALOX_CHROMIUM_SANDBOX=true` or `browser.chromiumSandbox: true` when the host supports Chromium user namespaces / sandboxing.\n',
          )
          PY

      - name: Commit sandbox hardening
        run: |
          if git diff --quiet; then
            echo "Sandbox slice already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/BrowserManager.ts tests/unit/BrowserManager.test.ts Dockerfile docs/DOCKER.md
          git commit -m "fix: enable Chromium sandbox mode in Docker"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
