name: Finalize Xvfb ownership patch

on:
  push:
    branches:
      - fix/browser-process-cleanup
    paths:
      - .github/workflows/fix-xvfb-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/browser-process-cleanup
      - name: Fix patch details
        run: python3 .github/scripts/finalize_xvfb_patch.py
      - name: Commit and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/BrowserManager.ts tests/unit/XvfbDisplay.test.ts
          git rm .github/workflows/fix-xvfb-patch.yml .github/scripts/finalize_xvfb_patch.py
          git commit -m "fix: finalize Xvfb ownership cleanup"
          git push origin HEAD:fix/browser-process-cleanup
