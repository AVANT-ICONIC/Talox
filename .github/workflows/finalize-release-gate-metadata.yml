name: Finalize release gate metadata

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'ci/manual-release-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Patch current v9 metadata
        shell: python
        run: |
          from pathlib import Path

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          modern_aria = "- **Modern ARIA page state** — Playwright 1.62 ARIA snapshots with browser-computed bounding boxes are now the primary semantic source for `TaloxPageState.nodes`, with legacy accessibility and DOM collectors retained as compatibility fallbacks."
          release_gate = "- **Guarded GitHub release gate** — manual, dry-run-first release automation validates tag/version/changelog alignment, typecheck, build, unit tests, runtime dependency audit, package contents, and Chromium integration before a separately permissioned publish job may create the GitHub tag/release."
          if release_gate not in text:
              if modern_aria not in text:
                  raise SystemExit("modern ARIA changelog anchor missing")
              text = text.replace(modern_aria, modern_aria + "\n" + release_gate, 1)

          old_tests = "- **127 unit test files / 1,975 unit tests** verified passing on the final v9 release baseline, together with all six browser integration shards, the browser aggregate gate, and Docker build/runtime/sandbox smoke gates."
          new_tests = "- **128 unit test files / 1,983 unit tests** verified passing on the final v9 release baseline, together with all six browser integration shards, the browser aggregate gate, Docker build/runtime/sandbox smoke gates, and release-contract validation."
          if old_tests not in text and new_tests not in text:
              raise SystemExit("v9 changelog test baseline anchor missing")
          text = text.replace(old_tests, new_tests, 1)
          changelog.write_text(text)

          agents = Path("AGENTS.md")
          text = agents.read_text()
          old_baseline = "- **Validation baseline:** 127 unit test files / 1,975 unit tests plus all six browser integration shards, the browser aggregate gate, and Docker runtime/sandbox gates green."
          new_baseline = "- **Validation baseline:** 128 unit test files / 1,983 unit tests plus all six browser integration shards, the browser aggregate gate, Docker runtime/sandbox gates, and release-contract validation green."
          if old_baseline not in text and new_baseline not in text:
              raise SystemExit("AGENTS v9 validation baseline anchor missing")
          text = text.replace(old_baseline, new_baseline, 1)

          release_line = "- **Release engineering:** GitHub releases use a manual dry-run-first gate; validation runs read-only and repository write permission is isolated to the final publish job."
          if release_line not in text:
              anchor = "- **Reliability work:** deterministic browser-error fast paths, BrowserManager/Xvfb lifecycle hardening, profile ownership protection, and synthetic-document collection fast paths are included."
              if anchor not in text:
                  raise SystemExit("AGENTS reliability anchor missing")
              text = text.replace(anchor, anchor + "\n" + release_line, 1)
          agents.write_text(text)

      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run --config vitest.config.unit.ts tests/unit/prepare-release.test.ts
      - run: node scripts/prepare-release.mjs v9.0.0 /tmp/talox-v9-release-notes.md

      - name: Verify historical release notes retained
        run: |
          grep -Fq '## [8.1.0]' CHANGELOG.md
          grep -Fq '## [8.0.0]' CHANGELOG.md
          grep -Fq '## [7.7.0]' CHANGELOG.md

      - name: Commit validated metadata and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-release-gate-metadata.yml
          git add CHANGELOG.md AGENTS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: align v9 metadata with release gate"
          git push origin HEAD:${{ github.head_ref }}
