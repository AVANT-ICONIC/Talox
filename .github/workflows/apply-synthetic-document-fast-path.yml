name: Validate synthetic-document fast path

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-validate:
    if: github.head_ref == 'perf/synthetic-document-state-fast-path'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/synthetic-document-state-fast-path
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply synthetic-document fast path
        run: python3 .github/scripts/apply_synthetic_document_fast_path.py
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Focused collector units
        run: npx vitest run --config vitest.config.unit.ts tests/unit/PageStateCollector.test.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Measure error paths
        run: npx vitest run --config vitest.config.browser.ts tests/core/error-paths.test.ts
      - name: Commit validated change and remove transaction helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-synthetic-document-fast-path.yml .github/scripts/apply_synthetic_document_fast_path.py
          git add src/core/PageStateCollector.ts tests/unit/PageStateCollector.test.ts
          git commit -m "perf: skip hydration retries for synthetic documents"
          git push origin HEAD:perf/synthetic-document-state-fast-path
