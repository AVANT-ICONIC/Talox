name: Validate modern ARIA runtime contract

on:
  push:
    branches:
      - feat/modern-aria-state

permissions:
  contents: write

jobs:
  contract-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/modern-aria-state
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply runtime contract updates
        run: python3 .github/scripts/apply_modern_aria_contract.py
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Verify runtime contract alignment
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const pw = lock.packages['node_modules/playwright'];
          const core = lock.packages['node_modules/playwright-core'];
          if (pkg.engines.node !== '>=20.0.0') throw new Error(`Talox engine mismatch: ${pkg.engines.node}`);
          if (!pw?.version?.startsWith('1.62.') || !core?.version?.startsWith('1.62.')) throw new Error('Playwright 1.62 lock mismatch');
          if (pw.engines?.node !== '>=20' || core.engines?.node !== '>=20') throw new Error('Unexpected Playwright engine contract');
          NODE
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Commit validated contract and remove transaction helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-modern-aria-contract.yml .github/scripts/apply_modern_aria_contract.py
          git add package.json package-lock.json README.md CHANGELOG.md docs/MODERN-ARIA-STATE.md
          git commit -m "docs: align modern ARIA runtime contract"
          git push origin HEAD:feat/modern-aria-state
