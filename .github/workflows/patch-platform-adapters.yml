name: One-shot platform adapter planner wiring

on:
  push:
    branches:
      - feat/platform-adapters-v8-2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/platform-adapters-v8-2
          fetch-depth: 0
      - name: Patch planner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/core/loop/Planner.ts')
          text = path.read_text()

          import_anchor = '// src/core/loop/Planner.ts\n\n'
          import_line = 'import { getPlatformAdapterContext } from "../platform/PlatformAdapterRegistry.js";\n\n'
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          call_anchor = '\t\tthis.appendSkillsAndHints(parts, skillsContext, domainHints);\n'
          call_line = '\t\tthis.appendPlatformAdapterContext(parts, state.url, state.title);\n'
          if call_line not in text:
              text = text.replace(call_anchor, call_anchor + call_line, 1)

          method_anchor = '\tprivate appendSkillsAndHints(parts: string[], skillsContext?: string, domainHints?: string): void {\n'
          method = '''\tprivate appendPlatformAdapterContext(parts: string[], url: string, title?: string): void {\n\t\tconst context = getPlatformAdapterContext(url, title);\n\t\tif (context) parts.push(`\\n## Platform Knowledge\\n${context}`);\n\t}\n\n'''
          if method not in text:
              text = text.replace(method_anchor, method + method_anchor, 1)

          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/loop/Planner.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: inject platform adapters into planner context"
          git push origin HEAD:feat/platform-adapters-v8-2
