name: Apply issue 145 patch

on:
  push:
    branches:
      - fix/session-har-context-coverage
    paths:
      - .github/workflows/apply-issue-145-patch.yml
      - .github/scripts/apply-issue-145-patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/session-har-context-coverage
          fetch-depth: 0
      - name: Apply exact HAR context patch
        run: python .github/scripts/apply-issue-145-patch.py
      - name: Commit patch
        run: |
          git rm .github/workflows/apply-issue-145-patch.yml .github/scripts/apply-issue-145-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/HarRecorder.ts src/core/controller/TaloxController.ts
          git commit -m "fix: record session HAR at browser-context scope"
          git push origin HEAD:fix/session-har-context-coverage
