name: Update Xvfb env changelog

on:
  push:
    branches:
      - fix/browser-process-cleanup
    paths:
      - .github/workflows/update-xvfb-env-changelog.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/browser-process-cleanup
      - name: Update lifecycle changelog
        run: python3 .github/scripts/update_xvfb_env_changelog.py
      - name: Commit changelog and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git rm .github/workflows/update-xvfb-env-changelog.yml .github/scripts/update_xvfb_env_changelog.py
          git commit -m "docs: record Xvfb caller env preservation"
          git push origin HEAD:fix/browser-process-cleanup
