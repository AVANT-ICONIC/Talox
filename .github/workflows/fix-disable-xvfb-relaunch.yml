name: Fix virtual-display disable relaunch
on:
  push:
    branches: [fix/browser-process-cleanup]
    paths: [.github/workflows/fix-disable-xvfb-relaunch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/browser-process-cleanup
      - name: Stop disabled Xvfb before relaunch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/core/BrowserManager.ts')
          s = p.read_text()
          old = '''\t\t// Start Xvfb if virtualDisplay is enabled — runs Chromium in "headed"\n\t\t// mode against a virtual framebuffer so its fingerprint is real.\n\t\tif (this.config.settings.virtualDisplay && !this.xvfbProcess) {\n\t\t\tawait this.startXvfb();\n\t\t}\n'''
          new = '''\t\t// Keep Xvfb ownership aligned with the current configuration. A manager may\n\t\t// be reconfigured between launches; once virtualDisplay is disabled, tear\n\t\t// down the owned display before building replacement launch options.\n\t\tconst virtualDisplayEnabled = this.config.settings.virtualDisplay === true;\n\t\tif (!virtualDisplayEnabled && this.xvfbProcess) {\n\t\t\tthis.stopXvfb();\n\t\t}\n\t\tif (virtualDisplayEnabled && !this.xvfbProcess) {\n\t\t\tawait this.startXvfb();\n\t\t}\n'''
          if old not in s:
              raise SystemExit('Xvfb launch gate not found')
          s = s.replace(old, new, 1)
          old = '''\t\tconst newHash = this.computeLaunchHash({\n\t\t\theadless: launchOptions.headless,\n\t\t\tbrowserType: actualBrowserType,\n\t\t\tuserDataDir: profile.userDataDir,\n'''
          new = '''\t\tconst newHash = this.computeLaunchHash({\n\t\t\theadless: launchOptions.headless,\n\t\t\tbrowserType: actualBrowserType,\n\t\t\tvirtualDisplay: virtualDisplayEnabled,\n\t\t\tuserDataDir: profile.userDataDir,\n'''
          if old not in s:
              raise SystemExit('launch hash block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/unit/BrowserManager.test.ts')
          s = p.read_text()
          needle = '''\t\tit("keeps owned Xvfb alive when launch options require a browser relaunch", async () => {\n\t\t\tconst firstContext = createMockContext();\n'''
          replacement = '''\t\tit("keeps owned Xvfb alive when launch options require a browser relaunch", async () => {\n\t\t\tmanager.updateConfig({\n\t\t\t\tsettings: { ...manager.getConfig().settings, virtualDisplay: true } as any,\n\t\t\t});\n\t\t\tconst firstContext = createMockContext();\n'''
          if needle not in s:
              raise SystemExit('existing Xvfb relaunch test not found')
          s = s.replace(needle, replacement, 1)
          marker = '''\n\t\tit("pins browser launch env to the Xvfb display owned by this manager", async () => {\n'''
          new_test = '''\n\t\tit("stops owned Xvfb when virtualDisplay is disabled before a relaunch", async () => {\n\t\t\tmanager.updateConfig({\n\t\t\t\tsettings: { ...manager.getConfig().settings, virtualDisplay: true } as any,\n\t\t\t});\n\t\t\tconst firstContext = createMockContext();\n\t\t\tconst secondContext = createMockContext();\n\t\t\t(chromium.launchPersistentContext as ReturnType<typeof vi.fn>)\n\t\t\t\t.mockResolvedValueOnce(firstContext)\n\t\t\t\t.mockResolvedValueOnce(secondContext);\n\t\t\tconst xvfb = { kill: vi.fn() };\n\t\t\t(manager as any).xvfbProcess = xvfb;\n\t\t\t(manager as any).xvfbDisplay = ":125";\n\n\t\t\tconst profile = createTestProfile();\n\t\t\tawait manager.launch(profile, false, "chromium", { args: ["--virtual-display"] });\n\t\t\tmanager.updateConfig({\n\t\t\t\tsettings: { ...manager.getConfig().settings, virtualDisplay: false } as any,\n\t\t\t});\n\t\t\tawait manager.launch(profile, false, "chromium", { args: ["--no-virtual-display"] });\n\n\t\t\texpect(firstContext.close).toHaveBeenCalledTimes(1);\n\t\t\texpect(xvfb.kill).toHaveBeenCalledWith("SIGTERM");\n\t\t\texpect((manager as any).xvfbProcess).toBeNull();\n\t\t\texpect((manager as any).xvfbDisplay).toBeNull();\n\t\t\tconst secondLaunch = (chromium.launchPersistentContext as ReturnType<typeof vi.fn>).mock.calls[1][1];\n\t\t\texpect(secondLaunch.headless).toBe(true);\n\t\t\texpect(secondLaunch.env?.DISPLAY).not.toBe(":125");\n\n\t\t\tawait manager.close();\n\t\t});\n'''
          if marker not in s:
              raise SystemExit('Xvfb pinning test marker not found')
          p.write_text(s.replace(marker, new_test + marker, 1))

          p = Path('CHANGELOG.md')
          s = p.read_text()
          s = s.replace('127 unit test files / 1,958 tests expected after BrowserManager/Xvfb lifecycle, overlap, startup-failure, display-pinning, and relaunch regression coverage', '127 unit test files / 1,959 tests expected after BrowserManager/Xvfb lifecycle, overlap, startup-failure, display-pinning, relaunch, and virtual-display-disable regression coverage', 1)
          old = 'each browser launch is pinned to its manager-owned display, caller-provided launch environments are preserved while pinning `DISPLAY`, and browser configuration relaunches preserve the live Xvfb process.'
          new = 'each browser launch is pinned to its manager-owned display, caller-provided launch environments are preserved while pinning `DISPLAY`, browser configuration relaunches preserve the live Xvfb process while virtual display remains enabled, and disabling virtual display tears down Xvfb before replacement launch.'
          if old not in s:
              raise SystemExit('changelog lifecycle sentence not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-disable-xvfb-relaunch.yml
          git add src/core/BrowserManager.ts tests/unit/BrowserManager.test.ts CHANGELOG.md
          git commit -m "fix: stop Xvfb when virtual display is disabled"
          git push origin HEAD:fix/browser-process-cleanup
