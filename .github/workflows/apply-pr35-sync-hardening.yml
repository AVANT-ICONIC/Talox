name: Apply PR35 sync hardening
on:
  push:
    branches: [perf/error-path-fast-fail-v2]
    paths: [.github/workflows/apply-pr35-sync-hardening.yml]
permissions:
  contents: write
jobs:
  sync-harden-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/error-path-fast-fail-v2
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit -X ours origin/main
      - name: Apply lifecycle sync and launch serialization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/core/BrowserManager.ts')
          s = p.read_text()

          if '\tvirtualDisplay?: boolean;\n' not in s:
              old = '\theadless: boolean;\n\tbrowserType: BrowserType;\n'
              if old not in s: raise SystemExit('LaunchOptions marker missing')
              s = s.replace(old, old + '\tvirtualDisplay?: boolean;\n', 1)

          if 'private launchInFlight = false;' not in s:
              old = '\tprivate launchOptionsHash: string | null = null;\n'
              if old not in s: raise SystemExit('launchOptionsHash marker missing')
              s = s.replace(old, old + '\tprivate launchInFlight = false;\n', 1)

          if 'String(options.virtualDisplay ?? false),' not in s:
              old = '\t\t\tString(options.browserType),\n'
              if old not in s: raise SystemExit('launch hash marker missing')
              s = s.replace(old, old + '\t\t\tString(options.virtualDisplay ?? false),\n', 1)

          old_vd = '''\t\t// Start Xvfb if virtualDisplay is enabled — runs Chromium in "headed"\n\t\t// mode against a virtual framebuffer so its fingerprint is real.\n\t\tif (this.config.settings.virtualDisplay && !this.xvfbProcess) {\n\t\t\tawait this.startXvfb();\n\t\t}\n'''
          new_vd = '''\t\t// Keep Xvfb ownership aligned with the current configuration. A manager may\n\t\t// be reconfigured between launches; once virtualDisplay is disabled, tear\n\t\t// down the owned display before building replacement launch options.\n\t\tconst virtualDisplayEnabled = this.config.settings.virtualDisplay === true;\n\t\tif (!virtualDisplayEnabled && this.xvfbProcess) {\n\t\t\tthis.stopXvfb();\n\t\t}\n\t\tif (virtualDisplayEnabled && !this.xvfbProcess) {\n\t\t\tawait this.startXvfb();\n\t\t}\n'''
          if 'const virtualDisplayEnabled = this.config.settings.virtualDisplay === true;' not in s:
              if old_vd not in s: raise SystemExit('virtual display startup block missing')
              s = s.replace(old_vd, new_vd, 1)

          old_env = '\t\t\tlaunchOptions.env = { ...process.env, DISPLAY: this.xvfbDisplay };\n'
          new_env = '''\t\t\tconst launchEnv = launchOptions.env as NodeJS.ProcessEnv | undefined;\n\t\t\tlaunchOptions.env = { ...(launchEnv ?? process.env), DISPLAY: this.xvfbDisplay };\n'''
          if 'const launchEnv = launchOptions.env as NodeJS.ProcessEnv | undefined;' not in s:
              if old_env not in s: raise SystemExit('DISPLAY launch env marker missing')
              s = s.replace(old_env, new_env, 1)

          hash_call = '\t\t\tbrowserType: actualBrowserType,\n'
          if '\t\t\tvirtualDisplay: virtualDisplayEnabled,\n' not in s:
              if hash_call not in s: raise SystemExit('launch hash call marker missing')
              s = s.replace(hash_call, hash_call + '\t\t\tvirtualDisplay: virtualDisplayEnabled,\n', 1)

          signature = '''\tasync launch(\n\t\tprofile: TaloxProfile,\n\t\t_headed?: boolean,\n\t\tbrowserType?: BrowserType,\n\t\textraOptions?: any,\n\t): Promise<BrowserContext> {\n'''
          if 'LAUNCH_IN_PROGRESS: Browser launch is already in progress for this manager.' not in s:
              if signature not in s: raise SystemExit('launch signature missing')
              guarded = signature + '''\t\tif (this.launchInFlight) {\n\t\t\tthrow new Error("LAUNCH_IN_PROGRESS: Browser launch is already in progress for this manager.");\n\t\t}\n\t\tthis.launchInFlight = true;\n\t\ttry {\n'''
              s = s.replace(signature, guarded, 1)
              close_idx = s.index('\n\tasync close() {')
              launch_end = s.rfind('\n\t}', 0, close_idx)
              if launch_end < 0: raise SystemExit('launch method end missing')
              s = s[:launch_end] + '''\n\t\t} finally {\n\t\t\tthis.launchInFlight = false;\n\t\t}\n\t}''' + s[launch_end + 3:]

          p.write_text(s)

          p = Path('tests/unit/BrowserManager.test.ts')
          t = p.read_text()
          insertion_marker = '\t});\n\n\t// ─── Context Management'
          if insertion_marker not in t: raise SystemExit('BrowserManager launch describe marker missing')

          additions = []
          if 'preserves caller-provided browser env while pinning Xvfb DISPLAY' not in t:
              additions.append('''\n\t\tit("preserves caller-provided browser env while pinning Xvfb DISPLAY", async () => {\n\t\t\tconst mockCtx = createMockContext();\n\t\t\t(chromium.launchPersistentContext as ReturnType<typeof vi.fn>).mockResolvedValue(mockCtx);\n\t\t\t(manager as any).xvfbDisplay = ":124";\n\n\t\t\tawait manager.launch(createTestProfile(), false, "chromium", {\n\t\t\t\tenv: { TALOX_TEST_ONLY: "kept", PATH: "/restricted" },\n\t\t\t});\n\n\t\t\tconst callArgs = (chromium.launchPersistentContext as ReturnType<typeof vi.fn>).mock.calls[0][1];\n\t\t\texpect(callArgs.env).toEqual({\n\t\t\t\tTALOX_TEST_ONLY: "kept",\n\t\t\t\tPATH: "/restricted",\n\t\t\t\tDISPLAY: ":124",\n\t\t\t});\n\t\t});\n''')

          if 'stops owned Xvfb when virtualDisplay is disabled before a relaunch' not in t:
              additions.append('''\n\t\tit("stops owned Xvfb when virtualDisplay is disabled before a relaunch", async () => {\n\t\t\tmanager.updateConfig({\n\t\t\t\tsettings: { ...manager.getConfig().settings, virtualDisplay: true } as any,\n\t\t\t});\n\t\t\tconst firstContext = createMockContext();\n\t\t\tconst secondContext = createMockContext();\n\t\t\t(chromium.launchPersistentContext as ReturnType<typeof vi.fn>)\n\t\t\t\t.mockResolvedValueOnce(firstContext)\n\t\t\t\t.mockResolvedValueOnce(secondContext);\n\t\t\tconst xvfb = { kill: vi.fn() };\n\t\t\t(manager as any).xvfbProcess = xvfb;\n\t\t\t(manager as any).xvfbDisplay = ":125";\n\n\t\t\tconst profile = createTestProfile();\n\t\t\tawait manager.launch(profile, false, "chromium", { args: ["--virtual-display"] });\n\t\t\tmanager.updateConfig({\n\t\t\t\tsettings: { ...manager.getConfig().settings, virtualDisplay: false } as any,\n\t\t\t});\n\t\t\tawait manager.launch(profile, false, "chromium", { args: ["--no-virtual-display"] });\n\n\t\t\texpect(firstContext.close).toHaveBeenCalledTimes(1);\n\t\t\texpect(xvfb.kill).toHaveBeenCalledWith("SIGTERM");\n\t\t\texpect((manager as any).xvfbProcess).toBeNull();\n\t\t\texpect((manager as any).xvfbDisplay).toBeNull();\n\t\t\tconst secondLaunch = (chromium.launchPersistentContext as ReturnType<typeof vi.fn>).mock.calls[1][1];\n\t\t\texpect(secondLaunch.headless).toBe(true);\n\t\t\texpect(secondLaunch.env?.DISPLAY).not.toBe(":125");\n\n\t\t\tawait manager.close();\n\t\t});\n''')

          if 'relaunches when only virtualDisplay changes' not in t:
              additions.append('''\n\t\tit("relaunches when only virtualDisplay changes", async () => {\n\t\t\tmanager.updateConfig({\n\t\t\t\tsettings: { ...manager.getConfig().settings, virtualDisplay: true } as any,\n\t\t\t});\n\t\t\tconst firstContext = createMockContext();\n\t\t\tconst secondContext = createMockContext();\n\t\t\t(chromium.launchPersistentContext as ReturnType<typeof vi.fn>)\n\t\t\t\t.mockResolvedValueOnce(firstContext)\n\t\t\t\t.mockResolvedValueOnce(secondContext);\n\t\t\tconst xvfb = { kill: vi.fn() };\n\t\t\t(manager as any).xvfbProcess = xvfb;\n\t\t\t(manager as any).xvfbDisplay = ":126";\n\n\t\t\tconst profile = createTestProfile();\n\t\t\tconst launchOptions = { headless: false };\n\t\t\tawait manager.launch(profile, false, "chromium", launchOptions);\n\t\t\tmanager.updateConfig({\n\t\t\t\tsettings: { ...manager.getConfig().settings, virtualDisplay: false } as any,\n\t\t\t});\n\t\t\tawait manager.launch(profile, false, "chromium", launchOptions);\n\n\t\t\texpect(firstContext.close).toHaveBeenCalledTimes(1);\n\t\t\texpect(chromium.launchPersistentContext).toHaveBeenCalledTimes(2);\n\t\t\texpect(xvfb.kill).toHaveBeenCalledWith("SIGTERM");\n\t\t\texpect(manager.getContext()).toBe(secondContext);\n\n\t\t\tawait manager.close();\n\t\t});\n''')

          if 'rejects concurrent launch calls on the same manager' not in t:
              additions.append('''\n\t\tit("rejects concurrent launch calls on the same manager", async () => {\n\t\t\tconst context = createMockContext();\n\t\t\tlet resolveLaunch!: (ctx: ReturnType<typeof createMockContext>) => void;\n\t\t\tconst pendingLaunch = new Promise<ReturnType<typeof createMockContext>>((resolve) => {\n\t\t\t\tresolveLaunch = resolve;\n\t\t\t});\n\t\t\t(chromium.launchPersistentContext as ReturnType<typeof vi.fn>).mockImplementationOnce(() => pendingLaunch);\n\t\t\tconst profile = createTestProfile("same-manager-concurrent");\n\n\t\t\tconst firstLaunch = manager.launch(profile);\n\t\t\tawait vi.waitFor(() => expect(chromium.launchPersistentContext).toHaveBeenCalledTimes(1));\n\t\t\tawait expect(manager.launch(profile)).rejects.toThrow("LAUNCH_IN_PROGRESS");\n\t\t\texpect(chromium.launchPersistentContext).toHaveBeenCalledTimes(1);\n\n\t\t\tresolveLaunch(context);\n\t\t\tawait expect(firstLaunch).resolves.toBe(context);\n\t\t\tawait manager.close();\n\t\t});\n''')

          if additions:
              t = t.replace(insertion_marker, ''.join(additions) + '\n' + insertion_marker, 1)
          p.write_text(t)
          PY
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Focused unit validation
        run: npx vitest run --config vitest.config.unit.ts tests/unit/BrowserManager.test.ts tests/unit/BrowserManagerBundledDetection.test.ts tests/unit/ActionExecutor.test.ts tests/unit/InteractionReliability.test.ts
      - name: Commit validated sync
        run: |
          git rm .github/workflows/apply-pr35-sync-hardening.yml
          git add src/core/BrowserManager.ts tests/unit/BrowserManager.test.ts CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: serialize BrowserManager launches and sync lifecycle hardening"
            git push origin HEAD:perf/error-path-fast-fail-v2
          fi
