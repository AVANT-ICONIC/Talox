name: Full Dependency Audit Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/full-dependency-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install full dependency graph
        run: npm ci --ignore-scripts
      - name: Dependency paths for affected packages
        run: npm ls chromium extract-zip tmp esbuild vite postcss nanoid brace-expansion || true
      - name: Full audit diagnostics
        continue-on-error: true
        run: npm audit --json
