name: Docker

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - docs/DOCKER.md
      - package.json
      - package-lock.json
      - src/**
      - .github/workflows/docker.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - docs/DOCKER.md
      - package.json
      - package-lock.json
      - src/**
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Resolve locked Playwright version
        id: playwright
        run: |
          version=$(node -p 'require("./package-lock.json").packages["node_modules/playwright-core"].version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Locked playwright-core: $version"

      - name: Fetch matching Playwright sandbox profile
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/microsoft/playwright/v${{ steps.playwright.outputs.version }}/utils/docker/seccomp_profile.json" \
            -o playwright-seccomp.json

      - name: Build Talox image
        run: docker build --build-arg PLAYWRIGHT_VERSION=${{ steps.playwright.outputs.version }} --tag talox:ci .

      - name: Verify non-root runtime
        run: test "$(docker run --rm --entrypoint id talox:ci -u)" != "0"

      - name: Smoke Talox CLI
        run: docker run --rm --init talox:ci init --help

      - name: Smoke Talox MCP CLI
        run: docker run --rm --init talox:ci mcp --help

      - name: Smoke top-level CLI help exit codes
        run: |
          docker run --rm --init talox:ci --help
          docker run --rm --init talox:ci -h

      - name: Reject unknown top-level commands
        run: |
          if docker run --rm --init talox:ci definitely-not-a-command; then
            echo "Unknown command unexpectedly exited successfully"
            exit 1
          fi

      - name: Probe sandboxed Playwright-managed Chromium
        run: |
          docker run --rm --init --ipc=host \
            --security-opt seccomp=playwright-seccomp.json \
            --entrypoint node talox:ci -e '
              const { chromium } = require("/opt/talox/node_modules/playwright-core");
              console.log(`PLAYWRIGHT_BROWSERS_PATH=${process.env.PLAYWRIGHT_BROWSERS_PATH ?? "unset"}`);
              console.log(`chromium.executablePath=${chromium.executablePath()}`);
              (async () => {
                const browser = await chromium.launch({ headless: true, timeout: 10000, chromiumSandbox: true });
                try {
                  console.log(`Direct Chromium version: ${browser.version()}`);
                } finally {
                  await browser.close();
                }
              })().catch((error) => {
                console.error(error);
                process.exit(1);
              });
            '

      - name: Launch sandboxed Chromium through Talox
        run: |
          docker run --rm --init --ipc=host \
            --security-opt seccomp=playwright-seccomp.json \
            -e TALOX_CHROMIUM_SANDBOX=true \
            --entrypoint node talox:ci --input-type=module -e '
              import { BrowserManager, getDefaultConfig } from "/opt/talox/dist/core/BrowserManager.js";
              const config = getDefaultConfig();
              if (!config.browser.chromiumSandbox) throw new Error("Sandbox environment override was not applied");
              config.browser.autoDetect = false;
              config.settings.adaptiveStealthEnabled = false;
              process.env.DISPLAY = ":talox-headless-ci";
              const manager = new BrowserManager(config);
              const profile = {
                id: "docker-sandbox-ci",
                class: "sandbox",
                purpose: "docker sandbox smoke test",
                userDataDir: "/tmp/talox-docker-sandbox",
                metadata: { createdAt: new Date().toISOString(), lastUsed: new Date().toISOString() },
              };
              try {
                const context = await manager.launch(profile, false, "chromium", { headless: true });
                const page = await context.newPage();
                await page.goto("data:text/html,<title>Talox sandbox smoke</title>");
                if ((await page.title()) !== "Talox sandbox smoke") throw new Error("Sandboxed Talox page smoke failed");
                console.log("Talox sandboxed Chromium launch succeeded");
              } finally {
                await manager.closeAll();
              }
            '
