name: Apply issue 143 thinking follow-up

on:
  push:
    branches:
      - fix/multipage-attention-frame-scope
    paths:
      - .github/workflows/apply-issue-143-thinking-followup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/multipage-attention-frame-scope
          fetch-depth: 0
      - name: Apply exact thinking frame patch
        run: python .github/scripts/apply-issue-143-thinking-followup.py
      - name: Commit patch
        run: |
          git rm .github/workflows/apply-issue-143-thinking-followup.yml .github/scripts/apply-issue-143-thinking-followup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/controller/TaloxController.ts
          git commit -m "fix: scope thinking behavior to active attention frame"
          git push origin HEAD:fix/multipage-attention-frame-scope
