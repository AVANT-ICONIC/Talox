name: Fix Xvfb launch env

on:
  push:
    branches:
      - fix/browser-process-cleanup
    paths:
      - .github/workflows/fix-xvfb-launch-env.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/browser-process-cleanup
      - name: Apply Xvfb launch env fix
        run: python3 .github/scripts/fix_xvfb_launch_env.py
      - name: Commit patch and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/BrowserManager.ts tests/unit/BrowserManager.test.ts
          git rm .github/workflows/fix-xvfb-launch-env.yml .github/scripts/fix_xvfb_launch_env.py
          git commit -m "fix: pin browser launch to owned Xvfb display"
          git push origin HEAD:fix/browser-process-cleanup
