<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Table Test Page</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Employee Data</h1>
    <table id="employeeTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Salary</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Alice Johnson</td>
                <td>Engineering</td>
                <td>$120,000</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Bob Smith</td>
                <td>Marketing</td>
                <td>$95,000</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Carol Williams</td>
                <td>Engineering</td>
                <td>$130,000</td>
            </tr>
            <tr>
                <td>4</td>
                <td>David Brown</td>
                <td>HR</td>
                <td>$85,000</td>
            </tr>
            <tr>
                <td>5</td>
                <td>Eve Davis</td>
                <td>Engineering</td>
                <td>$125,000</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
